<style type="text/tailwindcss">
@layer base {
  html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

  h1,h2,h3 { @apply tracking-tight; }
}
@layer components {
  .card { @apply bg-white rounded-3xl shadow-soft p-4 sm:p-5 border border-slate-100/80 transition-shadow duration-300; }
  .card-hover { @apply hover:shadow-lift hover:-translate-y-1 transition duration-300; }
  .btn { @apply relative overflow-hidden inline-flex items-center justify-center gap-2 min-h-[44px] px-5 rounded-full font-semibold text-sm transition duration-200 select-none active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed; }

  .btn-danger { @apply bg-rose-50 text-rose-600 hover:bg-rose-100; }
  .btn-soft { @apply bg-brand-50 text-brand-600 hover:bg-brand-100; }
  .icon-btn { @apply inline-flex items-center justify-center w-11 h-11 rounded-full text-slate-500 hover:bg-slate-100 hover:text-ink transition active:scale-90 shrink-0; }
  .input { @apply w-full min-h-[44px] px-4 py-2.5 rounded-2xl bg-slate-100/80 border border-transparent outline-none transition duration-200 focus:bg-white focus:border-brand-400 focus:ring-4 focus:ring-brand-100 text-[15px] placeholder:text-slate-400; }
  .label { @apply block text-xs font-semibold text-slate-500 mb-1 ml-1; }

  .navlink.active { @apply text-brand-600 bg-brand-50; }
  .tab { @apply px-4 min-h-[40px] rounded-full text-sm font-semibold text-slate-500 transition; }
  .tab.on { @apply bg-white text-brand-600 shadow-soft; }
  .badge { @apply absolute -top-1.5 -right-2 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center; }

<style>
.nav{transition:background .3s,box-shadow .3s,backdrop-filter .3s;background:transparent}
.nav.scrolled{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(15,23,42,.06)}
.nav>div{transition:height .3s}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
.reveal-l{transform:translateX(-26px)}.reveal-r{transform:translateX(26px)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(var(--r,0deg))}}
.floaty{animation:floaty var(--t,6s) ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.92) translateY(6px)}100%{opacity:1;transform:none}}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes dotpulse{0%{box-shadow:0 0 0 0 rgba(34,211,165,.6)}100%{box-shadow:0 0 0 7px rgba(34,211,165,0)}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
.page-in{animation:pagein .45s cubic-bezier(.2,.7,.2,1)}
.page-out{opacity:0;transform:translateY(-6px);transition:opacity .11s,transform .11s}
.shake{animation:shake .4s}
.pop-in{animation:pop .28s cubic-bezier(.2,.8,.3,1.2)}
.dot-pulse{animation:dotpulse 2s infinite}
.skel{background:linear-gradient(90deg,#eef0f6 25%,#f7f8fc 37%,#eef0f6 63%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:1rem}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);width:40px;height:40px;margin:-20px 0 0 -20px;transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
.btn-ghost .rip,.btn-soft .rip,.btn-danger .rip{background:rgba(109,94,252,.22)}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
.btn-ghost.loading::after,.btn-soft.loading::after,.btn-danger.loading::after{border-color:#6d5efc;border-top-color:transparent}
.modal-wrap{animation:fadein .18s ease-out}.modal-wrap.closing{opacity:0;transition:opacity .18s}
.modal-card{animation:sheet .3s cubic-bezier(.2,.8,.3,1)}.modal-wrap.closing .modal-card{transform:translateY(18px);transition:transform .18s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
.toast{animation:pop .3s}.toast.out{opacity:0;transform:translateY(-8px);transition:.25s}
.picker{animation:pop .16s}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:#fff;border-radius:1.25rem;box-shadow:0 18px 50px rgba(15,23,42,.16);padding:.4rem;z-index:60;animation:pop .18s}
.menu a,.menu button{display:flex;align-items:center;gap:.6rem;width:100%;min-height:44px;padding:0 .8rem;border-radius:.9rem;font-size:.9rem;font-weight:500;text-align:left}
.menu a:hover,.menu button:hover{background:#f1f5f9}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.acc.open .acc-body{grid-template-rows:1fr}

.msg .mact{opacity:0;pointer-events:none;transform:translateY(4px);transition:.15s}
.msg.show .mact{opacity:1;pointer-events:auto;transform:none}

.chat-shell{height:calc(100dvh - 9.5rem)}

::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d6dae6;border-radius:8px}
.blob{position:absolute;border-radius:9999px;filter:blur(70px);opacity:.55;pointer-events:none}
.safe-b{padding-bottom:env(safe-area-inset-bottom)}

  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>

<div id="app"></div>

<script>
(() => {
'use strict';
/* =============================== utils =============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const REACTS = ['👍', '😆', '😢', '😲', '❤️', '😡'];
const S = { token: localStorage.getItem('wz_token') || null, me: null, counts: {}, posts: new Map(), comments: {}, feed: { cursor: null }, chats: [], chat: null, msgs: [], reply: null, img: null, limit: 60, sig: '', lastMid: 0, routeTok: 0, ftab: 'friends', atab: 'users', tick: 0 };

function ago(d) {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 45) return 'just now';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm';
  const h = Math.floor(m / 60); if (h < 24) return h + 'h';
  const dd = Math.floor(h / 24); if (dd < 7) return dd + 'd';
  return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: dd > 300 ? 'numeric' : undefined });
}
const clock = d => new Date(d).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

const P = {
  home: '<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  arrow: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  repeat: '<path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  reply: '<path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',
  smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  check: '<path d="m20 6-11 11-5-5"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  userplus: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>',
  ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  tag: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/>',
  zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  mega: '<path d="M3 11v2a1 1 0 0 0 1 1h3l8 5V5L7 10H4a1 1 0 0 0-1 1zM19 8a5 5 0 0 1 0 8"/>'
};
const ic = (n, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const logo = (s = 36) => `<span class="inline-flex items-center justify-center rounded-2xl bg-gradient-to-br from-brand-400 to-brand-600 text-white shadow-lift" style="width:${s}px;height:${s}px">${ic('msg', 'w-[55%] h-[55%]')}</span>`;

const GR = ['from-violet-400 to-indigo-500', 'from-pink-400 to-rose-500', 'from-amber-400 to-orange-500', 'from-emerald-400 to-teal-500', 'from-sky-400 to-blue-500', 'from-fuchsia-400 to-purple-500'];
const initials = u => ((u.first_name || '?')[0] + ((u.last_name || '')[0] || '')).toUpperCase();
function av(u, s = 40, dot = false) {
  const g = GR[(u.id || 0) % GR.length];
  const inner = u.avatar ? `<img src="${esc(u.avatar)}" alt="" loading="lazy" class="w-full h-full object-cover">` : `<span class="font-semibold text-white" style="font-size:${Math.round(s * .38)}px">${esc(initials(u))}</span>`;
  const d = Math.max(10, Math.round(s * .26));
  return `<span class="relative inline-block shrink-0" style="width:${s}px;height:${s}px"><span class="flex items-center justify-center w-full h-full rounded-full overflow-hidden bg-gradient-to-br ${g}">${inner}</span>${dot && u.active ? `<span class="absolute bottom-0 right-0 rounded-full bg-mint ring-2 ring-white dot-pulse" style="width:${d}px;height:${d}px" title="Active now"></span>` : ''}</span>`;
}
const chatAv = (c, s = 44) => av({ id: c.avatar_id || c.id, avatar: c.pic, first_name: c.title, last_name: '', active: c.active }, s, true);
const authImg = u => u ? u + (u.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(S.token) : '';
const skel = (n = 2) => Array.from({ length: n }, () => '<div class="card space-y-3"><div class="flex gap-3"><div class="skel w-11 h-11 !rounded-full"></div><div class="flex-1 space-y-2"><div class="skel h-3 w-1/3"></div><div class="skel h-3 w-1/5"></div></div></div><div class="skel h-16"></div></div>').join('');
const empty = (t, s = '', icon = 'smile') => `<div class="card text-center py-10"><div class="mx-auto w-14 h-14 rounded-2xl bg-brand-50 text-brand-500 flex items-center justify-center mb-3">${ic(icon, 'w-7 h-7')}</div><h3 class="font-semibold">${esc(t)}</h3><p class="text-sm text-slate-500 mt-1">${esc(s)}</p></div>`;

function toast(msg) {
  let w = $('#toasts');
  if (!w) { w = document.createElement('div'); w.id = 'toasts'; w.className = 'fixed top-3 inset-x-0 z-[100] flex flex-col items-center gap-2 pointer-events-none px-3'; document.body.appendChild(w); }
  const t = document.createElement('div');
  t.className = 'toast pointer-events-auto bg-ink text-white text-sm px-4 py-2.5 rounded-full shadow-lift max-w-full';
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 2800);
}
async function busy(btn, fn) {
  if (!btn || btn.disabled) return;
  btn.disabled = true; btn.classList.add('loading');
  try { return await fn(); } finally { btn.disabled = false; btn.classList.remove('loading'); }
}

/* =============================== api =============================== */
async function api(path, o = {}) {
  const r = await fetch('/api' + path, {
    method: o.method || (o.body ? 'POST' : 'GET'),
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) {
    if (S.token && !o.noAuthRedirect && (r.status === 401 || (r.status === 403 && /banned/i.test(d.error || '')))) { doLogout(); if (d.error) toast(d.error); }
    throw new Error(d.error || 'Request failed. Please try again.');
  }
  return d;
}

/* =============================== modal & pickers =============================== */
function modal(html, { wide = false, onClose } = {}) {
  const el = document.createElement('div');
  el.className = 'modal-wrap fixed inset-0 z-[80] flex items-end sm:items-center justify-center sm:p-4';
  el.innerHTML = `<div class="modal-bg absolute inset-0 bg-ink/45 backdrop-blur-sm"></div><div class="modal-card relative w-full ${wide ? 'sm:max-w-2xl' : 'sm:max-w-md'} max-h-[92dvh] overflow-y-auto bg-white rounded-t-3xl sm:rounded-3xl shadow-lift safe-b" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(el); document.body.classList.add('overflow-hidden');
  const close = () => {
    if (el._closing) return; el._closing = true; el.classList.add('closing');
    setTimeout(() => { el.remove(); if (!$('.modal-wrap')) document.body.classList.remove('overflow-hidden'); onClose && onClose(); }, RM ? 0 : 180);
  };
  $('.modal-bg', el).onclick = close; el._close = close;
  el.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  return el;
}
const mhead = t => `<div class="sticky top-0 z-10 bg-white/95 backdrop-blur flex items-center justify-between px-5 pt-4 pb-2"><h3 class="text-lg font-bold">${esc(t)}</h3><button data-close class="icon-btn -mr-2" aria-label="Close">${ic('x')}</button></div>`;
function askText(title, val = '', { ph = '', ok = 'Save' } = {}) {
  return new Promise(res => {
    const m = modal(`<form class="p-5 space-y-4"><h3 class="text-lg font-bold">${esc(title)}</h3><input class="input" name="v" value="${esc(val)}" placeholder="${esc(ph)}" maxlength="200"><div class="flex justify-end gap-2"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary">${esc(ok)}</button></div></form>`, { onClose: () => res(null) });
    $('form', m).onsubmit = e => { e.preventDefault(); res($('[name=v]', m).value.trim()); m._close(); };
    setTimeout(() => $('[name=v]', m).focus(), 60);
  });
}
function confirmBox(title, msg, ok = 'Confirm', danger = true) {
  return new Promise(res => {
    const m = modal(`<div class="p-5 space-y-4"><h3 class="text-lg font-bold">${esc(title)}</h3><p class="text-sm text-slate-500">${esc(msg)}</p><div class="flex justify-end gap-2"><button class="btn btn-ghost" data-close>Cancel</button><button id="cbOk" class="btn ${danger ? 'bg-rose-500 text-white hover:bg-rose-600' : 'btn-primary'}">${esc(ok)}</button></div></div>`, { onClose: () => res(false) });
    $('#cbOk', m).onclick = () => { res(true); m._close(); };
  });
}
function lightbox(src) {
  const m = modal(`<div class="relative bg-black"><button data-close class="icon-btn !bg-white/15 !text-white absolute top-3 right-3 z-10" aria-label="Close">${ic('x')}</button><img src="${esc(src)}" alt="" class="w-full max-h-[88dvh] object-contain"></div>`, { wide: true });
  $('.modal-card', m).classList.add('!bg-black');
}

let pickerEl = null;
function hidePicker() { if (pickerEl) { pickerEl.remove(); pickerEl = null; } }
function showPicker(anchor, cb) {
  hidePicker();
  const r = anchor.getBoundingClientRect();
  pickerEl = document.createElement('div');
  pickerEl.className = 'picker fixed z-[95] flex gap-0.5 bg-white rounded-full shadow-lift px-1.5 py-1 border border-slate-100';
  pickerEl.innerHTML = REACTS.map(e => `<button class="pk text-2xl w-11 h-11 rounded-full hover:scale-125 transition-transform" data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  document.body.appendChild(pickerEl);
  const w = pickerEl.offsetWidth, ph = pickerEl.offsetHeight;
  pickerEl.style.left = Math.min(Math.max(8, r.left), innerWidth - w - 8) + 'px';
  let top = r.top - ph - 6; if (top < 8) top = r.bottom + 6;
  pickerEl.style.top = top + 'px';
  pickerEl.onclick = e => { const b = e.target.closest('.pk'); if (b) { cb(b.dataset.e); hidePicker(); } };
  pickerEl.onmouseleave = () => setTimeout(() => { if (pickerEl && !pickerEl.matches(':hover')) hidePicker(); }, 200);
}

/* =============================== images =============================== */
function fileToImg(file, w, h, { crop = false, q = .82 } = {}) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read that file'));

          if (sw / sh > r) { const nw = sh * r; sx = (sw - nw) / 2; sw = nw; } else { const nh = sw / r; sy = (sh - nh) / 2; sh = nh; }
          dw = Math.min(w, Math.round(sw)); dh = Math.round(dw / r);

let io;
function reveal() {
  if (RM) { $$('.reveal').forEach(e => e.classList.add('in')); return; }
  io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  $$('.reveal:not(.in)').forEach(e => io.observe(e));
}
function counters() {
  const run = el => {
    const target = +el.dataset.count || 0;
    if (RM || !target) { el.textContent = target.toLocaleString(); return; }
    const t0 = performance.now(), dur = 1400;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(target * e).toLocaleString(); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { run(e.target); o.unobserve(e.target); } }), { threshold: .5 });
  $$('[data-count]').forEach(e => o.observe(e));
}
let ticking = false;
addEventListener('scroll', () => {

  requestAnimationFrame(() => {

function foot(p) {
  const total = Object.values(p.reactions || {}).reduce((a, b) => a + +b, 0);
  const top = Object.entries(p.reactions || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]).join('');
  const canRepost = p.privacy === 'public' || p.user.id === S.me.id;
  return `<div class="flex items-center justify-between text-sm text-slate-500 py-2.5"><span class="flex items-center gap-1.5 min-h-[20px]">${total ? `<span class="text-base leading-none">${top}</span><span>${total}</span>` : ''}</span><span class="flex gap-3"><button data-act="toggle-comments" data-id="${p.id}" class="hover:underline">${p.comment_count} comment${p.comment_count === 1 ? '' : 's'}</button><span>${p.share_count} repost${p.share_count === 1 ? '' : 's'}</span></span></div>
  <div class="grid grid-cols-3 gap-1 border-t border-slate-100 pt-1">
    <button data-act="react" data-pick data-kind="post" data-id="${p.id}" class="pbtn ${p.my_reaction ? '!text-brand-600 font-semibold' : ''}" aria-label="React"><span class="text-lg leading-none">${p.my_reaction || '👍'}</span><span>${p.my_reaction ? 'Reacted' : 'Like'}</span></button>
    <button data-act="toggle-comments" data-id="${p.id}" class="pbtn">${ic('msg')}<span>Comment</span></button>
    <button data-act="repost" data-id="${p.id}" class="pbtn ${canRepost ? '' : 'opacity-40'}" ${canRepost ? '' : 'title="Only public posts can be reposted"'}>${ic('repeat')}<span>Repost</span></button>
  </div>`;
}
function postCard(p, { open = false } = {}) {
  S.posts.set(p.id, p);
  const own = p.user.id === S.me.id, [pi, pl] = PRIV[p.privacy] || PRIV.public;
  const tags = (p.tags || []).length ? ` <span class="text-slate-500 font-normal">with ${p.tags.map(t => `<a href="#/profile/${t.id}" class="font-semibold text-ink hover:underline">${esc(t.name)}</a>`).join(', ')}</span>` : '';
  const shared = p.shared_post_id ? (p.shared ? miniPost(p.shared) : '<div class="mt-3 border border-dashed border-slate-200 rounded-2xl p-4 text-sm text-slate-400 text-center">This post isn\'t available.</div>') : '';
  return `<article class="card reveal" data-post="${p.id}">
    <div class="flex items-start gap-3"><a href="#/profile/${p.user.id}">${av(p.user, 44, true)}</a>
      <div class="min-w-0 flex-1"><p class="leading-snug"><a href="#/profile/${p.user.id}" class="font-semibold hover:underline">${esc(p.user.name)}</a>${p.shared_post_id ? ' <span class="text-slate-500 font-normal">reposted</span>' : ''}${tags}</p>
      <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5">${ago(p.created_at)} &middot; <span title="${pl}">${ic(pi, 'w-3 h-3')}</span></p></div>
      ${own || S.me.is_admin ? `<button data-act="post-del" data-id="${p.id}" class="icon-btn -mt-1 -mr-2" aria-label="Delete post">${ic('trash', 'w-[18px] h-[18px]')}</button>` : ''}</div>
    ${p.content ? `<p class="mt-3 whitespace-pre-wrap break-words" style="font-size:clamp(.95rem,2.4vw,1.02rem)">${esc(p.content)}</p>` : ''}
    ${p.image ? `<img src="${esc(authImg(p.image))}" alt="Post photo" loading="lazy" data-act="lightbox" class="mt-3 w-full max-h-[34rem] object-cover rounded-2xl cursor-zoom-in hover:brightness-95 transition">` : ''}
    ${shared}
    <div data-foot="${p.id}">${foot(p)}</div>
    <div data-comments="${p.id}" class="${open ? '' : 'hidden'} pt-3 border-t border-slate-100 mt-2"></div>
  </article>`;
}
const renderFoot = p => $$(`[data-foot="${p.id}"]`).forEach(f => f.innerHTML = foot(p));

function adjust(o, next) {
  o.reactions = o.reactions || {};
  if (o.my_reaction) { o.reactions[o.my_reaction] = Math.max(0, (+o.reactions[o.my_reaction] || 0) - 1); if (!o.reactions[o.my_reaction]) delete o.reactions[o.my_reaction]; }
  if (next) o.reactions[next] = (+o.reactions[next] || 0) + 1;
  o.my_reaction = next;
}
async function reactPost(id, emoji) {
  const p = S.posts.get(id); if (!p) return;
  const next = p.my_reaction === emoji ? null : emoji;
  adjust(p, next); renderFoot(p);
  try { await api(`/posts/${id}/react`, { body: { type: next } }); } catch (e) { toast(e.message); }
}

async function loadFeed(reset, userId, tok) {
  if (reset) S.feed.cursor = null;
  const r = await api('/feed?' + (userId ? 'user_id=' + userId + '&' : '') + (S.feed.cursor ? 'before=' + S.feed.cursor : ''));
  if (tok !== S.routeTok) return;
  const box = $('#feed'); if (!box) return;
  if (reset) box.innerHTML = '';
  box.insertAdjacentHTML('beforeend', r.posts.map(p => postCard(p)).join(''));
  if (reset && !r.posts.length) box.innerHTML = empty('No posts yet', userId && userId !== S.me.id ? 'Nothing to show here.' : 'Be the first to share something!', 'globe');
  if (r.posts.length) S.feed.cursor = r.posts[r.posts.length - 1].id;
  const more = $('#more'); if (more) more.innerHTML = r.posts.length >= 20 ? `<button data-act="more" data-user="${userId || ''}" class="btn btn-ghost">Load more</button>` : '';
  reveal();
}
async function viewHome(_, tok) {
  $('#view').innerHTML = `<div class="max-w-2xl mx-auto space-y-4">
    <div class="card flex items-center gap-3">${av(S.me, 44)}<button data-act="compose" class="flex-1 text-left min-h-[44px] px-4 rounded-full bg-slate-100 hover:bg-slate-200/70 text-slate-500 transition truncate">What's on your mind, ${esc(S.me.first_name)}?</button><button data-act="compose-photo" class="icon-btn !text-brand-500" aria-label="Add photo">${ic('image', 'w-6 h-6')}</button></div>
    <div id="feed" class="space-y-4">${skel(2)}</div><div id="more" class="text-center pb-4"></div></div>`;
  await loadFeed(true, null, tok);
}

/* composer */
async function openComposer(withPhoto = false) {
  const st = { image: null, tags: new Map() };
  const m = modal(`<form class="pb-5">${mhead('Create post')}
    <div class="px-5 space-y-3">
      <div class="flex items-center gap-3">${av(S.me, 44)}<div><p class="font-semibold leading-tight">${esc(S.me.first_name + ' ' + S.me.last_name)}</p>
        <select name="privacy" class="mt-0.5 text-xs font-semibold bg-slate-100 rounded-full px-2.5 min-h-[30px] outline-none focus:ring-2 focus:ring-brand-200" aria-label="Who can see your post?"><option value="public">🌍 Public</option><option value="friends">👥 Friends</option><option value="me">🔒 Only me</option></select></div></div>
      <textarea name="content" rows="4" maxlength="5000" class="w-full resize-none outline-none text-lg placeholder:text-slate-400 min-h-[110px]" placeholder="What's on your mind, ${esc(S.me.first_name)}?"></textarea>
      <div id="cImg"></div><div id="cTags" class="flex flex-wrap gap-2"></div>
      <div id="tagPanel" class="hidden rounded-2xl border border-slate-200 p-2 max-h-52 overflow-y-auto"></div>
      <div class="flex items-center gap-2 border border-slate-200 rounded-2xl p-1.5"><span class="text-sm font-medium text-slate-500 px-2 flex-1">Add to your post</span>
        <button type="button" data-ci="photo" class="icon-btn !text-emerald-500" aria-label="Add photo">${ic('image', 'w-6 h-6')}</button>
        <button type="button" data-ci="tag" class="icon-btn !text-brand-500" aria-label="Tag friends">${ic('tag', 'w-6 h-6')}</button></div>
      <button class="btn btn-primary w-full">Post</button></div></form>`);
  const f = $('form', m);
  const drawImg = () => { $('#cImg', m).innerHTML = st.image ? `<div class="relative"><img src="${st.image}" class="w-full max-h-64 object-cover rounded-2xl" alt=""><button type="button" data-ci="rm" class="icon-btn !bg-white/90 absolute top-2 right-2 !w-9 !h-9 shadow-soft" aria-label="Remove photo">${ic('x', 'w-4 h-4')}</button></div>` : ''; };
  const drawTags = () => { $('#cTags', m).innerHTML = [...st.tags.values()].map(u => `<span class="chip">${esc(u.name)}<button type="button" data-untag="${u.id}" class="ml-1" aria-label="Remove tag">&times;</button></span>`).join(''); };
  f.addEventListener('click', async e => {
    const b = e.target.closest('[data-ci],[data-untag]'); if (!b) return;
    if (b.dataset.untag) { st.tags.delete(+b.dataset.untag); drawTags(); return; }
    const k = b.dataset.ci;
    if (k === 'photo') { st.image = await pick(PH); drawImg(); }
    if (k === 'rm') { st.image = null; drawImg(); }
    if (k === 'tag') {
      const tp = $('#tagPanel', m); tp.classList.toggle('hidden');
      if (!tp.dataset.loaded) {
        tp.innerHTML = '<p class="text-sm text-slate-400 p-2">Loading friends…</p>';
        try {
          const r = await api('/friends'); tp.dataset.loaded = 1;
          tp.innerHTML = r.friends.length ? r.friends.map(u => `<label class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 cursor-pointer min-h-[44px]"><input type="checkbox" value="${u.id}" class="w-5 h-5 accent-[#6d5efc]">${av(u, 32)}<span class="text-sm font-medium">${esc(u.name)}</span></label>`).join('') : '<p class="text-sm text-slate-400 p-2">Add friends to tag them.</p>';
          tp.onchange = ev => { const id = +ev.target.value, u = r.friends.find(x => x.id === id); ev.target.checked ? st.tags.set(id, u) : st.tags.delete(id); drawTags(); };
        } catch (ex) { tp.innerHTML = `<p class="text-sm text-rose-500 p-2">${esc(ex.message)}</p>`; }
      }
    }
  });
  f.onsubmit = async e => {
    e.preventDefault();
    const content = f.content.value.trim();
    if (!content && !st.image) { toast('Write something or add a photo.'); return; }
    await busy($('.btn-primary', f), async () => {
      try {
        const r = await api('/posts', { body: { content, image: st.image, privacy: f.privacy.value, tags: [...st.tags.keys()] } });
        m._close(); toast('Posted!');
        const feed = $('#feed');
        if (feed && (location.hash === '#/home' || location.hash === '' || location.hash.startsWith('#/profile'))) {
          if (feed.querySelector('.text-center.py-10')) feed.innerHTML = '';
          feed.insertAdjacentHTML('afterbegin', postCard(r.post)); reveal();
        }
      } catch (ex) { toast(ex.message); }
    });
  };
  setTimeout(() => f.content.focus(), 80);
  if (withPhoto) { st.image = await pick(PH); drawImg(); }
}
async function openRepost(id) {
  const p = S.posts.get(id); if (!p) return;
  const root = p.shared_post_id && p.shared ? p.shared : p;
  const m = modal(`<form class="pb-5">${mhead('Repost')}<div class="px-5 space-y-3">
    <textarea name="content" rows="3" maxlength="5000" class="input resize-none" placeholder="Say something about this… (optional)"></textarea>
    <select name="privacy" class="input" aria-label="Who can see this?"><option value="public">🌍 Public</option><option value="friends">👥 Friends</option><option value="me">🔒 Only me</option></select>
    ${miniPost(root)}<button class="btn btn-primary w-full">Repost now</button></div></form>`);
  const f = $('form', m);
  f.onsubmit = async e => {
    e.preventDefault();
    await busy($('.btn-primary', f), async () => {
      try {
        const r = await api(`/posts/${root.id}/repost`, { body: { content: f.content.value, privacy: f.privacy.value } });
        m._close(); toast('Reposted!');
        const feed = $('#feed'); if (feed) { feed.insertAdjacentHTML('afterbegin', postCard(r.post)); reveal(); }

async function openPostModal(id) {
  try {
    const r = await api('/posts/' + id);
    const m = modal(`${mhead('Post')}<div class="px-3 pb-4">${postCard(r.post, { open: true })}</div>`, { wide: true });
    $$('.reveal', m).forEach(e => e.classList.add('in'));

/* comments */
const commentTree = list => { const by = {}, roots = []; list.forEach(c => { c.kids = []; by[c.id] = c; }); list.forEach(c => (c.parent_id && by[c.parent_id]) ? by[c.parent_id].kids.push(c) : roots.push(c)); return roots; };
function commentHTML(c, depth, pid) {
  const total = Object.values(c.reactions || {}).reduce((a, b) => a + +b, 0), top = Object.entries(c.reactions || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]).join('');
  const p = S.posts.get(pid), canDel = c.user.id === S.me.id || (p && p.user.id === S.me.id) || S.me.is_admin;
  return `<div data-cid="${c.id}"><div class="flex gap-2"><a href="#/profile/${c.user.id}">${av(c.user, depth ? 28 : 34)}</a><div class="min-w-0 flex-1">
    <div class="relative inline-block max-w-full bg-slate-100 rounded-2xl px-3.5 py-2"><a href="#/profile/${c.user.id}" class="font-semibold text-sm hover:underline">${esc(c.user.name)}</a><p class="text-sm break-words whitespace-pre-wrap">${esc(c.content)}</p>${total ? `<span class="absolute -bottom-2.5 right-1 bg-white shadow-soft rounded-full px-1.5 text-xs">${top} ${total}</span>` : ''}</div>
    <div class="flex items-center gap-1 text-xs text-slate-500 mt-1 pl-2"><button data-act="c-react" data-pick data-kind="comment" data-id="${c.id}" data-pid="${pid}" class="min-h-[32px] px-2 rounded-lg font-semibold hover:bg-slate-100 ${c.my_reaction ? 'text-brand-600' : ''}">${c.my_reaction || 'Like'}</button><button data-act="c-reply" data-id="${c.id}" data-pid="${pid}" class="min-h-[32px] px-2 rounded-lg font-semibold hover:bg-slate-100">Reply</button><span>${ago(c.created_at)}</span>${canDel ? `<button data-act="c-del" data-id="${c.id}" data-pid="${pid}" class="min-h-[32px] px-2 rounded-lg hover:bg-slate-100 text-rose-500">Delete</button>` : ''}</div>
    <div data-reply-box></div></div></div>
    ${c.kids.length ? `<div class="${depth < 2 ? 'ml-8 sm:ml-10' : ''} mt-3 space-y-3">${c.kids.map(k => commentHTML(k, depth + 1, pid)).join('')}</div>` : ''}</div>`;
}
const cform = (pid, parent = '', ph = 'Write a comment…') => `<form data-form="c-add" data-pid="${pid}" data-parent="${parent}" class="flex items-center gap-2 mt-3">${av(S.me, 32)}<input class="input !rounded-full flex-1" placeholder="${ph}" maxlength="2000" aria-label="${ph}"><button class="icon-btn !text-brand-500" aria-label="Send comment">${ic('send')}</button></form>`;
function renderComments(pid) {
  const list = S.comments[pid] || [], tree = commentTree(list);
  $$(`[data-comments="${pid}"]`).forEach(b => {
    b.innerHTML = `<div class="space-y-4">${tree.map(c => commentHTML(c, 0, pid)).join('') || '<p class="text-sm text-slate-400 text-center py-2">No comments yet. Start the conversation!</p>'}</div>${cform(pid)}`;
  });
}
async function loadComments(pid) {
  $$(`[data-comments="${pid}"]`).forEach(b => { b.classList.remove('hidden'); b.innerHTML = '<div class="skel h-12"></div>'; });
  try { S.comments[pid] = (await api(`/posts/${pid}/comments`)).comments; renderComments(pid); } catch (e) { toast(e.message); }
}
async function reactComment(id, pid, emoji) {
  const c = (S.comments[pid] || []).find(x => x.id === id); if (!c) return;
  const next = c.my_reaction === emoji ? null : emoji; adjust(c, next); renderComments(pid);
  try { await api(`/comments/${id}/react`, { body: { type: next } }); } catch (e) { toast(e.message); }
}

/* =============================== friends =============================== */
let fTimer;
async function viewFriends(_, tok, q = '') {
  const v = $('#view');
  if (!$('#ftabs')) v.innerHTML = `<div class="max-w-2xl mx-auto space-y-4"><div id="ftabs"></div><div id="flist" class="space-y-3">${skel(2)}</div></div>`;
  const r = await api('/friends?q=' + encodeURIComponent(q)); if (tok !== S.routeTok) return;
  S.fr = r; S.fq = q; drawFriends();
}
function drawFriends() {
  const r = S.fr, t = S.ftab, q = (S.fq || '').toLowerCase();
  const tabs = [['friends', 'Friends', r.friends.length], ['requests', 'Requests', r.incoming.length], ['find', 'Find people', 0]];
  $('#ftabs').innerHTML = `<div class="flex gap-1 bg-slate-100 rounded-full p-1">${tabs.map(x => `<button data-act="ftab" data-t="${x[0]}" class="tab flex-1 ${t === x[0] ? 'on' : ''}">${x[1]}${x[0] === 'requests' && x[2] ? ` <span class="badge-inline ml-1">${x[2]}</span>` : ''}</button>`).join('')}</div>
    <div class="relative mt-3"><span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">${ic('search', 'w-[18px] h-[18px]')}</span><input id="fsearch" class="input !pl-11" placeholder="Search by name or ID" value="${esc(S.fq || '')}" aria-label="Search people"></div>`;
  const row = (u, btns, sub = '') => `<div class="reveal card !p-3 flex items-center gap-3" ><a href="#/profile/${u.id}">${av(u, 52, true)}</a><div class="min-w-0 flex-1"><a href="#/profile/${u.id}" class="font-semibold hover:underline block truncate">${esc(u.name)}</a><p class="text-xs text-slate-400">ID: ${esc(u.uid)}${sub}</p></div><div class="flex gap-2 shrink-0">${btns}</div></div>`;
  let html = '';
  if (t === 'friends') {
    const l = r.friends.filter(u => !q || u.name.toLowerCase().includes(q) || u.uid.includes(q));
    html = l.length ? l.map(u => row(u, `<button data-act="dm" data-id="${u.id}" class="btn btn-primary !px-4">${ic('msg', 'w-4 h-4')}<span class="hidden xs:inline">Message</span></button><button data-act="unfriend" data-id="${u.id}" class="icon-btn" aria-label="Unfriend">${ic('x')}</button>`, u.active ? ' &middot; <span class="text-emerald-500">Active now</span>' : '')).join('') : empty(q ? 'No matches' : 'No friends yet', 'Head to "Find people" to add some.', 'users');
  } else if (t === 'requests') {
    html = (r.incoming.length ? `<h3 class="font-semibold px-1">Friend requests</h3>` + r.incoming.map(u => row(u, `<button data-act="accept" data-id="${u.id}" class="btn btn-primary !px-4">Confirm</button><button data-act="unfriend" data-id="${u.id}" class="btn btn-ghost !px-4">Delete</button>`)).join('') : empty('No new requests', 'When someone adds you, it shows up here.', 'userplus'))
      + (r.outgoing.length ? `<h3 class="font-semibold px-1 pt-3">Sent requests</h3>` + r.outgoing.map(u => row(u, `<button data-act="unfriend" data-id="${u.id}" class="btn btn-ghost !px-4">Cancel</button>`)).join('') : '');
  } else {
    html = r.people.length ? r.people.map(u => row(u, `<button data-act="add" data-id="${u.id}" class="btn btn-soft !px-4">${ic('userplus', 'w-4 h-4')} Add</button>`)).join('') : empty('No one found', 'Try another name or ID.', 'search');
  }
  $('#flist').innerHTML = html; reveal();
  const inp = $('#fsearch'); inp.oninput = () => { clearTimeout(fTimer); fTimer = setTimeout(() => { if (S.ftab === 'find') viewFriends(null, S.routeTok, inp.value.trim()); else { S.fq = inp.value.trim(); const pos = inp.value; drawFriends(); $('#fsearch').value = pos; $('#fsearch').focus(); } }, 280); };
}

async function viewProfile(arg, tok) {
  const id = arg ? +arg : S.me.id, v = $('#view'); v.innerHTML = skel(2);
  let u; try { u = await api('/users/' + id); } catch (e) { v.innerHTML = empty('Profile unavailable', e.message, 'user'); return; }
  if (tok !== S.routeTok) return;
  const own = u.relation === 'self';

      ${c.members.map(m => { const u = m.user, isMe = u.id === me; return `<div class="flex items-center gap-3 p-2 rounded-2xl hover:bg-slate-50"><a href="#/profile/${u.id}" data-close>${av(u, 42, true)}</a><div class="min-w-0 flex-1"><p class="font-medium text-sm truncate">${esc(m.nickname || u.name)}${isMe ? ' (You)' : ''}</p><p class="text-xs text-slate-400 truncate">${m.nickname ? esc(u.name) + ' · ' : ''}${m.role === 'admin' ? '<span class="text-brand-600 font-semibold">Admin</span>' : m.role === 'coadmin' ? '<span class="text-brand-600 font-semibold">Co-admin</span>' : 'Member'}</p></div>
        <div class="flex shrink-0"><button data-act="g-nick" data-id="${u.id}" class="icon-btn !w-10 !h-10" aria-label="Edit nickname" title="Nickname">${ic('edit', 'w-4 h-4')}</button>
        ${mine === 'admin' && m.role !== 'admin' ? `<button data-act="g-role" data-id="${u.id}" data-make="${m.role === 'coadmin' ? '' : '1'}" class="icon-btn !w-10 !h-10 ${m.role === 'coadmin' ? '!text-brand-600' : ''}" aria-label="Toggle co-admin" title="${m.role === 'coadmin' ? 'Remove co-admin' : 'Make co-admin'}">${ic('shield', 'w-4 h-4')}</button>` : ''}
        ${!isMe && canMod && m.role !== 'admin' && (mine === 'admin' || m.role === 'member') ? `<button data-act="g-remove" data-id="${u.id}" class="icon-btn !w-10 !h-10 !text-rose-500" aria-label="Remove" title="Remove from group">${ic('x', 'w-4 h-4')}</button>` : ''}</div></div>`; }).join('')}</div></div>
    <button data-act="g-leave" class="btn btn-danger w-full">${ic('logout', 'w-4 h-4')} Leave group</button></div>`;
}
function openSettings() { S.setEl = modal(settingsHTML()); }
function refreshSettings() { if (S.setEl && document.body.contains(S.setEl)) { const card = $('.modal-card', S.setEl), st = card.scrollTop; card.innerHTML = settingsHTML(); card.scrollTop = st; } }
async function afterSettings() { await refreshChat(); refreshSettings(); }
async function openAddPeople() {
  const c = S.chat;
  try {
    const r = await api('/friends'), inChat = new Set(c.members.map(m => m.user.id)), list = r.friends.filter(u => !inChat.has(u.id));
    const m = modal(`<form>${mhead('Add people')}<div class="px-5 pb-5 space-y-3">${list.length ? `<div class="max-h-72 overflow-y-auto space-y-1">${list.map(u => `<label class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 cursor-pointer min-h-[48px]"><input type="checkbox" value="${u.id}" class="w-5 h-5 accent-[#6d5efc]">${av(u, 38)}<span class="font-medium text-sm">${esc(u.name)}</span></label>`).join('')}</div><button class="btn btn-primary w-full">Add to group</button>` : '<p class="text-sm text-slate-500 py-4 text-center">All your friends are already in this group.</p>'}</div></form>`);
    $('form', m).onsubmit = async e => {
      e.preventDefault(); const ids = $$('input:checked', m).map(i => +i.value); if (!ids.length) return;
      await busy($('.btn-primary', m), async () => { try { await api(`/chats/${c.id}/members`, { body: { user_ids: ids } }); m._close(); toast('Added'); await afterSettings(); } catch (ex) { toast(ex.message); } });
    };
  } catch (e) { toast(e.message); }
}
async function openNewGroup() {
  try {
    const r = await api('/friends');
    if (!r.friends.length) { toast('Add some friends first to create a group.'); return; }
    const m = modal(`<form>${mhead('New group chat')}<div class="px-5 pb-5 space-y-3"><input name="name" class="input" placeholder="Group name" maxlength="60" aria-label="Group name"><p class="label !mb-0">Add friends</p><div class="max-h-64 overflow-y-auto space-y-1">${r.friends.map(u => `<label class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 cursor-pointer min-h-[48px]"><input type="checkbox" value="${u.id}" class="w-5 h-5 accent-[#6d5efc]">${av(u, 38, true)}<span class="font-medium text-sm">${esc(u.name)}</span></label>`).join('')}</div><button class="btn btn-primary w-full">Create group</button></div></form>`);
    $('form', m).onsubmit = async e => {
      e.preventDefault(); const ids = $$('input:checked', m).map(i => +i.value);
      if (!ids.length) { toast('Pick at least one friend.'); return; }
      await busy($('.btn-primary', m), async () => { try { const g = await api('/chats/group', { body: { name: $('[name=name]', m).value, members: ids } }); m._close(); location.hash = '#/messages/' + g.id; } catch (ex) { toast(ex.message); } });
    };
  } catch (e) { toast(e.message); }
}

/* =============================== admin =============================== */
async function viewAdmin(_, tok) {
  if (!S.me.is_admin) { $('#view').innerHTML = empty('Admins only', 'You do not have access to this page.', 'shield'); return; }
  const v = $('#view'), t = S.atab;
  v.innerHTML = `<div class="max-w-3xl mx-auto space-y-4"><h1 class="text-2xl font-extrabold px-1 flex items-center gap-2">${ic('shield', 'w-6 h-6 text-brand-500')} Developer panel</h1>
    <div class="flex gap-1 bg-slate-100 rounded-full p-1 overflow-x-auto">${[['users', 'Users'], ['chats', 'Group chats'], ['announce', 'Announcement'], ['reports', 'Reports']].map(x => `<button data-act="atab" data-t="${x[0]}" class="tab flex-1 whitespace-nowrap ${t === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div><div id="abody">${skel(1)}</div></div>`;
  const body = $('#abody');
  if (t === 'users') {
    const r = await api('/admin/users'); if (tok !== S.routeTok) return;
    body.innerHTML = `<input id="asearch" class="input mb-3" placeholder="Search users by name, email or ID" aria-label="Search users"><div id="ausers" class="space-y-2"></div>`;
    const draw = q => { $('#ausers').innerHTML = r.users.filter(u => !q || (u.name + u.email + u.uid).toLowerCase().includes(q)).map(u => `<div class="card !p-3 flex items-center gap-3">${av(u, 44, true)}<div class="min-w-0 flex-1"><p class="font-semibold truncate">${esc(u.name)} ${u.is_admin ? '<span class="chip">Developer</span>' : ''} ${u.banned ? '<span class="chip !bg-rose-50 !text-rose-600">Banned</span>' : ''}</p><p class="text-xs text-slate-400 truncate">${esc(u.email)} &middot; ID ${esc(u.uid)}</p></div>${u.is_admin ? '' : `<button data-act="a-ban" data-id="${u.id}" data-banned="${u.banned ? '' : '1'}" class="btn ${u.banned ? 'btn-soft' : 'btn-ghost'} !px-3">${u.banned ? 'Unban' : 'Ban'}</button><button data-act="a-del" data-id="${u.id}" data-name="${esc(u.name)}" class="icon-btn !text-rose-500" aria-label="Delete account">${ic('trash')}</button>`}</div>`).join('') || '<p class="text-center text-slate-400 py-6">No users found.</p>'; };
    draw(''); $('#asearch').oninput = e => draw(e.target.value.trim().toLowerCase());
  } else if (t === 'chats') {
    const r = await api('/admin/chats'); if (tok !== S.routeTok) return;
    body.innerHTML = r.chats.length ? r.chats.map(c => `<div class="card !p-3 flex items-center gap-3 mb-2"><div class="w-11 h-11 rounded-2xl bg-brand-50 text-brand-500 flex items-center justify-center">${ic('users')}</div><div class="min-w-0 flex-1"><p class="font-semibold truncate">${esc(c.name)}</p><p class="text-xs text-slate-400">${c.members} members &middot; ${c.messages} messages &middot; by ${esc(c.creator || 'unknown')}</p></div><button data-act="a-chat-del" data-id="${c.id}" data-name="${esc(c.name)}" class="icon-btn !text-rose-500" aria-label="Delete group">${ic('trash')}</button></div>`).join('') : empty('No group chats', '', 'users');
  } else if (t === 'announce') {
    const r = await api('/admin/announcement'); if (tok !== S.routeTok) return;
    body.innerHTML = `<div class="card space-y-3"><h3 class="font-semibold">Announcement banner</h3><p class="text-sm text-slate-500">Shown at the top of the app for every user.</p>${r.announcement ? `<div class="bg-brand-50 text-brand-700 rounded-2xl p-3 text-sm"><b>Live:</b> ${esc(r.announcement.text)}</div>` : ''}<form data-form="a-ann" class="space-y-3"><textarea name="text" rows="3" maxlength="500" class="input resize-none" placeholder="Write an announcement…"></textarea><div class="flex gap-2"><button class="btn btn-primary flex-1">Publish</button>${r.announcement ? `<button type="button" data-act="a-ann-clear" class="btn btn-danger">Remove</button>` : ''}</div></form></div>`;
  } else {
    const r = await api('/admin/reports'); if (tok !== S.routeTok) return;
    body.innerHTML = r.reports.length ? r.reports.map(x => `<div class="card !p-4 space-y-2 mb-2"><div class="flex items-center gap-2 text-sm"><span class="chip !bg-rose-50 !text-rose-600">Reported</span><span class="text-slate-400">${ago(x.created_at)}</span></div><p class="text-sm bg-slate-50 rounded-2xl p-3 break-words">${x.content ? esc(x.content) : '<i class="text-slate-400">(no text)</i>'}${x.had_image ? ' 📷' : ''}</p><p class="text-xs text-slate-500">From <b>${esc(x.sender.name)}</b> &middot; reported by ${esc(x.reporter.name)}${x.reason ? ` &middot; "${esc(x.reason)}"` : ''}</p><div class="flex gap-2"><button data-act="a-ban" data-id="${x.sender.id}" data-banned="1" class="btn btn-danger !px-4">Ban sender</button><button data-act="a-rep-del" data-id="${x.id}" class="btn btn-ghost !px-4">Dismiss</button></div></div>`).join('') : empty('No reports', 'Reported messages will appear here.', 'flag');
  }
}

/* =============================== event delegation =============================== */
const FORM = {
  async 'c-add'(f) {
    const input = $('input', f), text = input.value.trim(); if (!text) return;
    const pid = +f.dataset.pid, parent = f.dataset.parent ? +f.dataset.parent : null; input.value = '';
    try {
      const r = await api(`/posts/${pid}/comments`, { body: { content: text, parent_id: parent } });
      (S.comments[pid] = S.comments[pid] || []).push(r.comment); const p = S.posts.get(pid); if (p) { p.comment_count++; renderFoot(p); } renderComments(pid);
    } catch (e) { toast(e.message); input.value = text; }
  },
  async send(f) {
    const ta = $('#minput'), text = ta.value.trim(); if (!text && !S.img) return;
    const body = { content: text, image: S.img, reply_to: S.reply ? S.reply.id : null };
    ta.value = ''; S.img = null; S.reply = null; drawImgPrev(); drawReply();
    try { await api(`/chats/${S.chat.id}/messages`, { body }); await pollMsgs(); const b = $('#msgs'); if (b) b.scrollTop = b.scrollHeight; loadChats(); }
    catch (e) { toast(e.message); ta.value = text; }
  },
  async 'g-name'(f) {
    const name = f.name.value.trim(); if (!name) return;
    await busy($('.btn', f), async () => { try { await api('/chats/' + S.chat.id, { method: 'PUT', body: { name } }); toast('Group renamed'); await afterSettings(); } catch (e) { toast(e.message); } });
  },
  async 'a-ann'(f) {
    await busy($('.btn-primary', f), async () => { try { await api('/admin/announcement', { body: { text: f.text.value } }); toast('Announcement published'); pollCounts(); route(true); } catch (e) { toast(e.message); } });
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f && FORM[f.dataset.form]) { e.preventDefault(); FORM[f.dataset.form](f); } });

const ACT = {
  auth: el => authModal(el.dataset.mode),
  acc: el => { const a = el.closest('.acc'), o = a.classList.toggle('open'); el.setAttribute('aria-expanded', o); },
  menu: () => $('#menu').classList.toggle('hidden'),
  logout: async () => { if (await confirmBox('Log out?', 'You will need to log in again to use Wazzup.', 'Log out', false)) { doLogout(); toast('Logged out'); } },
  'ann-close': el => { localStorage.setItem('wz_ann', el.dataset.id); $('#announce').innerHTML = ''; $('#announce').dataset.id = ''; },
  compose: () => openComposer(), 'compose-photo': () => openComposer(true),
  lightbox: el => lightbox(el.getAttribute('src')),
  more: async el => { await busy(el, () => loadFeed(false, el.dataset.user || null, S.routeTok)); },
  react: el => { reactPost(+el.dataset.id, S.posts.get(+el.dataset.id)?.my_reaction || '👍'); },
  repost: el => { const p = S.posts.get(+el.dataset.id); if (p && (p.privacy === 'public' || p.user.id === S.me.id)) openRepost(p.id); else toast('Only public posts can be reposted.'); },
  'post-del': async el => { if (!(await confirmBox('Delete post?', 'This cannot be undone.', 'Delete'))) return; try { await api('/posts/' + el.dataset.id, { method: 'DELETE' }); $$(`[data-post="${el.dataset.id}"]`).forEach(a => a.remove()); toast('Post deleted'); } catch (e) { toast(e.message); } },
  'toggle-comments': el => {
    const art = el.closest('[data-post]'), id = +art.dataset.post, box = $('[data-comments]', art);
    if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
    S.comments[id] ? (box.classList.remove('hidden'), renderComments(id)) : loadComments(id);
  },
  'c-react': el => { const pid = +el.dataset.pid, c = (S.comments[pid] || []).find(x => x.id === +el.dataset.id); reactComment(+el.dataset.id, pid, c?.my_reaction || '👍'); },
  'c-reply': el => {
    const wrap = el.closest('[data-cid]'), box = $('[data-reply-box]', wrap), c = (S.comments[+el.dataset.pid] || []).find(x => x.id === +el.dataset.id);
    box.innerHTML = cform(+el.dataset.pid, el.dataset.id, `Reply to ${c ? c.user.first_name : ''}…`); $('input', box).focus();
  },
  'c-del': async el => { if (!(await confirmBox('Delete comment?', 'Replies to it will be removed too.', 'Delete'))) return; const pid = +el.dataset.pid; try { await api('/comments/' + el.dataset.id, { method: 'DELETE' }); S.comments[pid] = (await api(`/posts/${pid}/comments`)).comments; const p = S.posts.get(pid); if (p) { p.comment_count = S.comments[pid].length; renderFoot(p); } renderComments(pid); } catch (e) { toast(e.message); } },
  /* friends */
  ftab: el => { S.ftab = el.dataset.t; S.fq = ''; viewFriends(null, S.routeTok, ''); },
  add: async el => { try { const r = await api('/friends/request', { body: { user_id: +el.dataset.id } }); toast(r.status === 'friends' ? 'You are now friends!' : 'Friend request sent'); if (el.dataset.pf) route(true); else { el.outerHTML = '<span class="btn btn-ghost !px-4 opacity-70">Requested</span>'; pollCounts(); } } catch (e) { toast(e.message); } },
  accept: async el => { try { await api('/friends/accept', { body: { user_id: +el.dataset.id } }); toast('Friend request accepted'); el.dataset.pf ? route(true) : viewFriends(null, S.routeTok, S.fq || ''); pollCounts(); } catch (e) { toast(e.message); } },
  unfriend: async el => {
    const friends = el.textContent.includes('✓') || el.getAttribute('aria-label') === 'Unfriend';
    if (friends && !(await confirmBox('Unfriend?', 'You can add them again later.', 'Unfriend'))) return;
    try { await api('/friends/remove', { body: { user_id: +el.dataset.id } }); el.dataset.pf ? route(true) : viewFriends(null, S.routeTok, S.fq || ''); pollCounts(); } catch (e) { toast(e.message); }
  },
  dm: el => openDm(+el.dataset.id),
  notif: el => { if (el.dataset.pid) openPostModal(+el.dataset.pid); else if (el.dataset.type.startsWith('friend')) location.hash = '#/friends'; else location.hash = '#/profile/' + el.dataset.uid; },
  /* profile */
  'edit-profile': () => editProfile(),
  'copy-id': el => { navigator.clipboard?.writeText(el.dataset.uid).then(() => toast('ID copied')).catch(() => toast('ID: ' + el.dataset.uid)); },
  /* messages */
  'new-group': () => openNewGroup(),
  'chat-settings': () => openSettings(),
  attach: async () => { S.img = await pick(PH); drawImgPrev(); },
  'rm-attach': () => { S.img = null; drawImgPrev(); },
  'cancel-reply': () => { S.reply = null; drawReply(); },
  older: async () => { S.limit += 100; await pollMsgs(true); },
  'm-tap': el => { const msg = el.closest('.msg'), was = msg.classList.contains('show'); $$('.msg.show').forEach(x => x.classList.remove('show')); if (!was) msg.classList.add('show'); },
  'm-react': el => { const id = +el.dataset.id; showPicker(el, e => reactMsg(id, e)); },
  'm-reply': el => {
    const m = S.msgs.find(x => x.id === +el.dataset.id); if (!m) return;
    S.reply = { id: m.id, name: m.sender_id === S.me.id ? 'yourself' : nameOf(m.sender_id, m.sender.name), text: m.content || (m.image ? '📷 Photo' : '') };
    $$('.msg.show').forEach(x => x.classList.remove('show')); drawReply(); $('#minput')?.focus();
  },
  'm-unsend': async el => { if (!(await confirmBox('Unsend message?', 'This removes it for everyone in the chat.', 'Unsend'))) return; try { await api(`/messages/${el.dataset.id}/unsend`, { method: 'POST', body: {} }); await pollMsgs(); } catch (e) { toast(e.message); } },
  'm-report': async el => { const r = await askText('Report message', '', { ph: 'What is wrong with this message? (optional)', ok: 'Report' }); if (r === null) return; try { await api(`/messages/${el.dataset.id}/report`, { body: { reason: r } }); toast('Thanks - we will review this message.'); } catch (e) { toast(e.message); } },
  jump: el => { const t = $(`[data-mid="${el.dataset.id}"]`); if (t) { t.scrollIntoView({ block: 'center', behavior: RM ? 'auto' : 'smooth' }); t.classList.remove('pop-in'); void t.offsetWidth; t.classList.add('pop-in'); } },
  block: async el => { if (!(await confirmBox('Block this user?', "They won't be able to message you and you won't see each other's posts.", 'Block'))) return; try { await api('/blocks', { body: { user_id: +el.dataset.id } }); toast('User blocked'); await afterSettings(); } catch (e) { toast(e.message); } },
  unblock: async () => { const o = S.chat.members.find(x => x.user.id !== S.me.id); try { await api('/blocks/' + o.user.id, { method: 'DELETE' }); toast('User unblocked'); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-nick': async el => { const id = +el.dataset.id, m = S.chat.members.find(x => x.user.id === id), v = await askText('Set nickname', m.nickname || '', { ph: m.user.name }); if (v === null) return; try { await api(`/chats/${S.chat.id}/nickname`, { method: 'PUT', body: { user_id: id, nickname: v } }); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-pic': async () => { const p = await pick(AV); try { await api('/chats/' + S.chat.id, { method: 'PUT', body: { picture: p } }); toast('Group photo updated'); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-add': () => openAddPeople(),
  'g-role': async el => { try { await api(`/chats/${S.chat.id}/coadmin`, { body: { user_id: +el.dataset.id, make: !!el.dataset.make } }); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-remove': async el => { const m = S.chat.members.find(x => x.user.id === +el.dataset.id); if (!(await confirmBox('Remove member?', `Remove ${m.user.name} from this group?`, 'Remove'))) return; try { await api(`/chats/${S.chat.id}/members/${el.dataset.id}`, { method: 'DELETE' }); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-leave': async () => { if (!(await confirmBox('Leave group?', "You won't receive messages from this group anymore.", 'Leave'))) return; try { await api(`/chats/${S.chat.id}/leave`, { method: 'POST', body: {} }); S.setEl?._close(); toast('You left the group'); location.hash = '#/messages'; } catch (e) { toast(e.message); } },
  /* admin */
  atab: el => { S.atab = el.dataset.t; route(true); },
  'a-ban': async el => { const ban = !!el.dataset.banned; if (ban && !(await confirmBox('Ban this user?', 'They will be logged out and unable to sign in.', 'Ban'))) return; try { await api('/admin/ban', { body: { user_id: +el.dataset.id, banned: ban } }); toast(ban ? 'User banned' : 'User unbanned'); route(true); } catch (e) { toast(e.message); } },
  'a-del': async el => { if (!(await confirmBox('Delete account?', `Permanently delete ${el.dataset.name} and all their data?`, 'Delete'))) return; try { await api('/admin/users/' + el.dataset.id, { method: 'DELETE' }); toast('Account deleted'); route(true); } catch (e) { toast(e.message); } },
  'a-chat-del': async el => { if (!(await confirmBox('Delete group chat?', `"${el.dataset.name}" and all its messages will be removed for everyone.`, 'Delete'))) return; try { await api('/admin/chats/' + el.dataset.id, { method: 'DELETE' }); toast('Group chat deleted'); route(true); } catch (e) { toast(e.message); } },
  'a-ann-clear': async () => { try { await api('/admin/announcement', { body: { text: '' } }); toast('Announcement removed'); pollCounts(); route(true); } catch (e) { toast(e.message); } },
  'a-rep-del': async el => { try { await api('/admin/reports/' + el.dataset.id, { method: 'DELETE' }); route(true); } catch (e) { toast(e.message); } }
};
document.addEventListener('click', e => {
  if (!e.target.closest('#menu,[data-act=menu]')) $('#menu')?.classList.add('hidden');
  if (pickerEl && !e.target.closest('.picker')) hidePicker();
  if (!e.target.closest('.msg')) $$('.msg.show').forEach(x => x.classList.remove('show'));
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el._long) { el._long = false; e.preventDefault(); return; }
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
  if (el.closest('#menu')) $('#menu')?.classList.add('hidden');
});
document.addEventListener('click', e => { const a = e.target.closest('#menu a'); if (a) $('#menu')?.classList.add('hidden'); });

/* reaction picker: hover (mouse) and long-press (touch) */
function openPick(b) {
  const id = +b.dataset.id, kind = b.dataset.kind;
  if (kind === 'post') showPicker(b, em => reactPost(id, em));
  else if (kind === 'comment') showPicker(b, em => reactComment(id, +b.dataset.pid, em));
}
let hoverT, pressT;
document.addEventListener('mouseover', e => { const b = e.target.closest('[data-pick]'); if (!b || b.contains(e.relatedTarget)) return; clearTimeout(hoverT); hoverT = setTimeout(() => openPick(b), 420); });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-pick]')) clearTimeout(hoverT); });
document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-pick]'); if (!b || e.pointerType === 'mouse') return; pressT = setTimeout(() => { b._long = true; openPick(b); }, 450); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => clearTimeout(pressT)));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-pick]')) e.preventDefault(); });
addEventListener('scroll', hidePicker, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hidePicker(); const m = $$('.modal-wrap').pop(); m && m._close && m._close(); } });

boot();
})();
</script>
