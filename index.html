<style>

.floaty{animation:floaty var(--t,6s) ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.92) translateY(6px)}100%{opacity:1;transform:none}}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@keyframes shimmer{to{background-position:-200% 0}}
@keyframes dotpulse{0%{box-shadow:0 0 0 0 rgba(34,211,165,.6)}100%{box-shadow:0 0 0 7px rgba(34,211,165,0)}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
.page-in{animation:pagein .45s cubic-bezier(.2,.7,.2,1)}
.page-out{opacity:0;transform:translateY(-6px);transition:opacity .11s,transform .11s}
.shake{animation:shake .4s}
.pop-in{animation:pop .28s cubic-bezier(.2,.8,.3,1.2)}
.dot-pulse{animation:dotpulse 2s infinite}
.skel{background:linear-gradient(90deg,#eef0f6 25%,#f7f8fc 37%,#eef0f6 63%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:1rem}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);width:40px;height:40px;margin:-20px 0 0 -20px;transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
.btn-ghost .rip,.btn-soft .rip,.btn-danger .rip{background:rgba(109,94,252,.22)}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
.btn-ghost.loading::after,.btn-soft.loading::after,.btn-danger.loading::after{border-color:#6d5efc;border-top-color:transparent}

.toast{animation:pop .3s}.toast.out{opacity:0;transform:translateY(-8px);transition:.25s}
.picker{animation:pop .16s}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:#fff;border-radius:1.25rem;box-shadow:0 18px 50px rgba(15,23,42,.16);padding:.4rem;z-index:60;animation:pop .18s}

.menu a:hover,.menu button:hover{background:#f1f5f9}
.popmenu{position:fixed;z-index:95;min-width:210px;background:#fff;border-radius:1.1rem;box-shadow:0 18px 50px rgba(15,23,42,.18);padding:.35rem;animation:pop .16s}

.acc.open .acc-body{grid-template-rows:1fr}

.msg .mact{opacity:0;pointer-events:none;transform:translateY(4px);transition:.15s}

.chat-shell{height:calc(100dvh - 9.5rem)}

.blob{position:absolute;border-radius:9999px;filter:blur(70px);opacity:.55;pointer-events:none}
.safe-b{padding-bottom:env(safe-area-inset-bottom)}
textarea{field-sizing:content}
.lp-target{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.rx3d{filter:drop-shadow(0 1.5px 1.5px rgba(15,23,42,.35))}
.rxbtn{position:relative;width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:9999px;transform-origin:50% 100%;animation:rxin .38s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*38ms);transition:transform .16s cubic-bezier(.3,1.6,.5,1)}

.rxtip{position:absolute;top:-26px;left:50%;transform:translateX(-50%) scale(.8);background:#0f172a;color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:9999px;opacity:0;pointer-events:none;transition:.15s;white-space:nowrap}

@keyframes rxin{from{opacity:0;transform:translateY(16px) scale(.3)}to{opacity:1;transform:none}}
@keyframes rxbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

}
</style>

function fileToImg(file, w, h, { crop = false, q = .82 } = {}) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read that file'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('That is not a valid image'));
      im.onload = () => {
        let sw = im.width, sh = im.height, sx = 0, sy = 0, dw, dh;
        if (crop) {
          const r = w / h;
          if (sw / sh > r) { const nw = sh * r; sx = (sw - nw) / 2; sw = nw; } else { const nh = sw / r; sy = (sh - nh) / 2; sh = nh; }
          dw = Math.min(w, Math.round(sw)); dh = Math.round(dw / r);
        } else { const k = Math.min(1, w / sw, h / sh); dw = Math.round(sw * k); dh = Math.round(sh * k); }
        const c = document.createElement('canvas'); c.width = dw; c.height = dh;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, dw, dh); x.drawImage(im, sx, sy, sw, sh, 0, 0, dw, dh);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

let io;
function reveal() {
  if (RM) { $$('.reveal').forEach(e => e.classList.add('in')); return; }
  io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });

}
function counters() {

    const target = +el.dataset.count || 0;
    if (RM || !target) { el.textContent = target.toLocaleString(); return; }
    const t0 = performance.now(), dur = 1400;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(target * e).toLocaleString(); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { run(e.target); o.unobserve(e.target); } }), { threshold: .5 });
  $$('[data-count]').forEach(e => o.observe(e));
}

    if (nav) nav.classList.toggle('scrolled', y > 8);

/* =============================== auth modal =============================== */
function authModal(mode = 'login', opts = {}) {
  const pics = { avatar: null, cover: null };
  const m = modal(`<div class="p-5 sm:p-7">
    <div class="flex items-center justify-between mb-5"><div id="authTabs" class="flex gap-1 bg-slate-100 rounded-full p-1"><button type="button" data-tab="login" class="tab">Log in</button><button type="button" data-tab="register" class="tab">Sign up</button></div><button data-close class="icon-btn ml-auto" aria-label="Close">${ic('x')}</button></div>
    <form id="authForm" class="space-y-3.5" novalidate></form></div>`);
  const form = $('#authForm', m);
  const draw = md => {
    mode = md;
    $$('[data-tab]', m).forEach(b => b.classList.toggle('on', b.dataset.tab === md));
    const reg = md === 'register';
    form.innerHTML = `
      <div><h2 class="text-2xl font-extrabold">${reg ? 'Create your account' : 'Welcome back'}</h2><p class="text-sm text-slate-500">${reg ? 'It only takes a minute.' : 'Log in to continue to Wazzup.'}</p></div>
      ${reg ? `<div class="grid grid-cols-2 gap-3"><div><label class="label">First name</label><input class="input" name="first_name" autocomplete="given-name" required></div><div><label class="label">Last name <span class="font-normal text-slate-400">(optional)</span></label><input class="input" name="last_name" autocomplete="family-name" placeholder="One name is fine"></div></div>
      <div><label class="label">Birthday</label><input class="input" type="date" name="birthday" max="${new Date().toISOString().slice(0, 10)}" required></div>` : ''}
      <div><label class="label">Email</label><input class="input" type="email" name="email" autocomplete="email" inputmode="email" required></div>
      <div><label class="label">Password</label><input class="input" type="password" name="password" autocomplete="${reg ? 'new-password' : 'current-password'}" minlength="6" required></div>
      ${reg ? `<div class="grid grid-cols-2 gap-3"><button type="button" data-p="avatar" class="btn btn-soft !rounded-2xl flex-col !py-3 h-auto"><span data-pv="avatar">${ic('camera')}</span><span class="text-xs">Profile photo</span></button><button type="button" data-p="cover" class="btn btn-soft !rounded-2xl flex-col !py-3 h-auto"><span data-pv="cover">${ic('image')}</span><span class="text-xs">Cover photo</span></button></div><p class="text-xs text-slate-400 -mt-1">Photos are optional - you can add or change them later on your profile.</p>` : ''}
      <p id="authErr" class="text-sm text-rose-500 min-h-[1.25rem]" role="alert"></p>
      <button type="submit" class="btn btn-primary w-full">${reg ? 'Create account' : 'Log in'}</button>`;
    $$('[data-p]', form).forEach(b => b.onclick = async () => {
      const k = b.dataset.p; pics[k] = await pick(k === 'avatar' ? AV : CV);
      $(`[data-pv=${k}]`, form).innerHTML = `<img src="${pics[k]}" class="w-9 h-9 rounded-full object-cover" alt="">`;
    });
    setTimeout(() => $('input', form)?.focus(), 50);
  };
  const accName = a => (a.first_name + ' ' + (a.last_name || '')).trim();
  const chooser = () => {
    const list = accounts(); mode = 'chooser'; $('#authTabs', m).classList.add('hidden');
    form.innerHTML = `<div><h2 class="text-2xl font-extrabold">Choose an account</h2><p class="text-sm text-slate-500">Tap your profile to log in.</p></div>
      <div class="space-y-1">${list.map(a => `<div class="flex items-center gap-1"><button type="button" data-use="${a.id}" class="flex items-center gap-3 flex-1 min-w-0 min-h-[60px] px-3 rounded-2xl hover:bg-slate-50 active:scale-[.99] text-left transition">${av({ id: a.id, avatar: a.avatar, first_name: a.first_name, last_name: a.last_name }, 48)}<span class="font-semibold truncate">${esc(accName(a))}</span></button><button type="button" data-forget="${a.id}" class="icon-btn" aria-label="Remove ${esc(accName(a))} from this device">${ic('x', 'w-4 h-4')}</button></div>`).join('')}</div>
      <div class="h-px bg-slate-100"></div>
      <div class="space-y-1"><button type="button" data-other="login" class="flex items-center gap-3 w-full min-h-[52px] px-3 rounded-2xl hover:bg-slate-50 font-semibold text-left"><span class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center">${ic('swap', 'w-[18px] h-[18px]')}</span>Use another account</button>
      <button type="button" data-other="register" class="flex items-center gap-3 w-full min-h-[52px] px-3 rounded-2xl hover:bg-slate-50 font-semibold text-left text-brand-600"><span class="w-9 h-9 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center">${ic('userplus', 'w-[18px] h-[18px]')}</span>Create new account</button></div>`;
  };
  form.addEventListener('click', async e => {
    const o = e.target.closest('[data-other]'), f = e.target.closest('[data-forget]'), u = e.target.closest('[data-use]');
    if (o) { $('#authTabs', m).classList.remove('hidden'); draw(o.dataset.other); }
    else if (f) { setAccounts(accounts().filter(x => x.id !== +f.dataset.forget)); if (accounts().length) chooser(); else { $('#authTabs', m).classList.remove('hidden'); draw('login'); } }
    else if (u) {
      const a = accounts().find(x => x.id === +u.dataset.use); if (!a || u.disabled) return;
      u.disabled = true; u.classList.add('opacity-60');
      try {
        const r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + a.token } });
        if (!r.ok) throw new Error('expired');
        S.token = a.token; localStorage.setItem('wz_token', a.token);
        m._close(); location.hash = '#/home'; await boot(); toast('Welcome back, ' + a.first_name + '!');
      } catch (ex) {
        $('#authTabs', m).classList.remove('hidden'); draw('login');
        if (a.email) form.email.value = a.email;
        $('#authErr', form).textContent = 'Your session expired. Enter your password to log in.';
        setTimeout(() => form.password.focus(), 60);
      }
    }
  });
  $$('[data-tab]', m).forEach(b => b.onclick = () => (b.dataset.tab === 'login' && accounts().length && opts.chooser !== false) ? chooser() : draw(b.dataset.tab));
  form.onsubmit = async e => {
    e.preventDefault();
    const err = $('#authErr', form); err.textContent = '';
    await busy($('[type=submit]', form), async () => {
      try {
        const fd = Object.fromEntries(new FormData(form));
        const r = await api(mode === 'login' ? '/login' : '/register', { body: mode === 'login' ? fd : { ...fd, ...pics }, noAuthRedirect: true });
        S.token = r.token; localStorage.setItem('wz_token', r.token);
        m._close(); location.hash = '#/home'; await boot();
        toast(mode === 'login' ? 'Welcome back!' : 'Welcome to Wazzup!');
      } catch (ex) {
        err.textContent = ex.message; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      }
    });
  };
  (mode === 'login' && opts.chooser !== false && accounts().length) ? chooser() : draw(mode);
}

const setActive = k => $$('[data-k]').forEach(a => a.classList.toggle('active', a.dataset.k === k));

function applyCounts() {
  const c = S.counts, a = c.announcement;
  const annUnseen = a && (+localStorage.getItem('wz_ann_seen') || 0) < a.id ? 1 : 0;
  const map = { friends: c.requests, messages: c.messages, notifications: (c.notifs || 0) + annUnseen };
  $$('[data-badge]').forEach(b => { const n = map[b.dataset.badge] || 0; b.textContent = n > 99 ? '99+' : n; b.classList.toggle('hidden', !n); });
  const tot = (c.requests || 0) + (c.messages || 0) + (c.notifs || 0) + annUnseen;
  document.title = (tot ? `(${tot}) ` : '') + 'Wazzup Messenger';
}
async function pollCounts() { if (!S.token || !S.me) return; try { S.counts = await api('/counts'); applyCounts(); } catch (e) {} }

/* =============================== router =============================== */
function stopChat() { clearInterval(S.chatTimer); S.chatTimer = null; clearInterval(S.typeTimer); S.typeTimer = null; S.chat = null; S.reply = null; S.img = null; S.sig = ''; S.lastMid = 0; S.limit = 60; }
function stopAll() { stopChat(); clearInterval(S.countTimer); S.countTimer = null; }

async function route(soft = false) {
  if (!S.me) return;
  stopChat();
  const parts = (location.hash.slice(2) || 'home').split('/'), page = parts[0] || 'home', arg = parts[1];
  document.body.classList.toggle('in-chat', page === 'messages' && !!arg);
  setActive(page === 'profile' && (!arg || +arg === S.me.id) ? 'profile' : page);
  const v = $('#view'), tok = ++S.routeTok;
  if (!soft) {
    v.classList.add('page-out'); await sleep(RM ? 0 : 110);
    v.classList.remove('page-out', 'page-in'); void v.offsetWidth; v.classList.add('page-in'); scrollTo(0, 0);
    if (tok !== S.routeTok) return;
  }
  const views = { home: viewHome, friends: viewFriends, messages: viewMessages, notifications: viewNotifs, profile: viewProfile, admin: viewAdmin, saved: viewSaved, post: viewPostPage, groups: viewGroups };
  try { await (views[page] || viewHome)(arg, tok); } catch (e) { if (tok === S.routeTok) v.innerHTML = empty('Something went wrong', e.message); }
  reveal();
}
addEventListener('hashchange', () => route());

const accounts = () => { try { return JSON.parse(localStorage.getItem('wz_accounts') || '[]'); } catch (e) { return []; } };
const setAccounts = a => localStorage.setItem('wz_accounts', JSON.stringify(a));
function saveAccount() {
  const m = S.me; if (!m || !S.token) return;
  const a = accounts().filter(x => x.id !== m.id);
  a.unshift({ id: m.id, token: S.token, email: m.email, first_name: m.first_name, last_name: m.last_name, avatar: m.avatar });
  setAccounts(a.slice(0, 6));
}
async function boot() {
  if (!S.token) return showLanding();
  try { S.me = await api('/me', { noAuthRedirect: true }); } catch (e) { setAccounts(accounts().filter(x => x.token !== S.token)); S.token = null; localStorage.removeItem('wz_token'); return showLanding(); }
  saveAccount(); shell(); clearInterval(S.countTimer);
  await pollCounts(); S.countTimer = setInterval(() => { pollCounts(); checkWarn(); }, 15000);
  route(); checkWarn();
}
let warnOpen = false;
async function checkWarn() {
  if (warnOpen || !S.token || !S.me) return;
  try {
    const r = await api('/warnings'); if (!r.warnings.length) return;
    warnOpen = true;
    const m = modal(`<div class="p-6 text-center space-y-3"><div class="mx-auto w-14 h-14 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center">${ic('flag', 'w-7 h-7')}</div><h3 class="text-xl font-extrabold">Warning from the admin</h3>${r.warnings.map(x => `<p class="text-sm text-slate-700 bg-amber-50 border border-amber-200 rounded-2xl p-3 break-words">${esc(x.message)}</p>`).join('')}<p class="text-xs text-slate-400">Continued violations may result in your account being banned.</p><button data-close class="btn btn-primary w-full">I understand</button></div>`, { onClose: () => { warnOpen = false; api('/warnings/seen', { body: {} }).catch(() => {}); } });
  } catch (e) {}
}
async function switchAcc(id) {
  const a = accounts().find(x => x.id === id); if (!a) return;
  stopAll(); S.me = null; S.posts.clear(); S.comments = {}; S.counts = {};
  S.token = a.token; localStorage.setItem('wz_token', a.token);
  history.replaceState(null, '', location.pathname + '#/home');
  await boot(); if (S.me) toast('Switched to ' + S.me.first_name);
}
function doLogout(removeAcc = false) {
  if (removeAcc) setAccounts(accounts().filter(x => x.token !== S.token));
  S.token = null; localStorage.removeItem('wz_token'); S.counts = {}; S.posts.clear();
  history.replaceState(null, '', location.pathname); showLanding();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollCounts(); });

/* =============================== posts =============================== */
const PRIV = { public: ['globe', 'Public'], friends: ['users', 'Friends'], me: ['lock', 'Only me'] };
function miniPost(p) {
  return `<div class="mt-3 border border-slate-200 rounded-2xl overflow-hidden"><div class="p-3"><div class="flex items-center gap-2 mb-2"><a href="#/profile/${p.user.id}">${av(p.user, 30)}</a><div><a href="#/profile/${p.user.id}" class="font-semibold text-sm hover:underline">${nm(p.user)}</a><p class="text-xs text-slate-400">${ago(p.created_at)}</p></div></div>${p.content ? `<p class="text-sm whitespace-pre-wrap break-words">${esc(p.content)}</p>` : ''}</div>${imgGrid(p, true)}</div>`;
}
function foot(p) {
  const total = Object.values(p.reactions || {}).reduce((a, b) => a + +b, 0);
  const canRepost = (p.privacy === 'public' || p.user.id === S.me.id) && !p.group;
  return `<div class="flex items-center justify-between text-sm text-slate-500 py-2.5"><span class="flex items-center gap-1.5 min-h-[20px]">${total ? `<button data-act="post-reactors" data-id="${p.id}" class="flex items-center gap-1.5 hover:underline" aria-label="See who reacted">${rxs(p.reactions)}<span>${total}</span></button>` : ''}</span><span class="flex gap-3"><button data-act="toggle-comments" data-id="${p.id}" class="hover:underline">${p.comment_count} comment${p.comment_count === 1 ? '' : 's'}</button><span>${p.share_count} repost${p.share_count === 1 ? '' : 's'}</span></span></div>
  <div class="grid grid-cols-3 gap-1 border-t border-slate-100 pt-1">
    <button data-act="react" data-pick data-kind="post" data-id="${p.id}" class="pbtn ${p.my_reaction ? '!text-brand-600 font-semibold' : ''}" aria-label="React">${p.my_reaction ? rxi(p.my_reaction, 22) : ic('thumb')}<span>${p.my_reaction ? RXN[p.my_reaction] : 'Like'}</span></button>
    <button data-act="toggle-comments" data-id="${p.id}" class="pbtn">${ic('msg')}<span>Comment</span></button>
    <button data-act="repost" data-id="${p.id}" class="pbtn ${canRepost ? '' : 'opacity-40'}" ${canRepost ? '' : 'title="Only public posts can be reposted"'}>${ic('repeat')}<span>Repost</span></button>
  </div>`;
}
function postCard(p, { open = false } = {}) {
  S.posts.set(p.id, p);
  const [pi, pl] = p.group ? ['users', 'Group'] : (PRIV[p.privacy] || PRIV.public);
  const grpTag = p.group && location.hash !== '#/groups/' + p.group.id ? ` <span class="text-slate-500 font-normal">in <a href="#/groups/${p.group.id}" class="font-semibold text-ink hover:underline">${esc(p.group.name)}</a></span>` : '';
  const tags = (p.tags || []).length ? ` <span class="text-slate-500 font-normal">with ${p.tags.map(t => `<a href="#/profile/${t.id}" class="font-semibold text-ink hover:underline">${esc(t.name)}</a>`).join(', ')}</span>` : '';
  const shared = p.shared_post_id ? (p.shared ? miniPost(p.shared) : '<div class="mt-3 border border-dashed border-slate-200 rounded-2xl p-4 text-sm text-slate-400 text-center">This post isn\'t available.</div>') : '';
  const hdr = open ? '' : `data-act="open-post" data-id="${p.id}"`;
  const name = open ? `<a href="#/profile/${p.user.id}" class="font-semibold hover:underline">${nm(p.user)}</a>` : `<span class="font-semibold">${nm(p.user)}</span>`;
  const gh = p.group && location.hash !== '#/groups/' + p.group.id ? p.group : null;
  const headHtml = gh ? `<a href="#/groups/${gh.id}" class="relative shrink-0 block w-11 h-11" aria-label="Open group">${gcover(gh, 'w-11 h-11')}<span class="absolute -bottom-1 -right-1 rounded-full ring-2 ring-white bg-white">${av(p.user, 24, true)}</span></a>
      <div class="min-w-0 flex-1"><p class="leading-snug flex items-center flex-wrap gap-x-1.5"><a href="#/groups/${gh.id}" class="font-bold hover:underline break-words">${esc(gh.name)}</a>${gh.joined ? '' : (gh.pending ? '<span class="text-slate-400">&bull;</span><span class="text-sm text-slate-400 font-semibold">Requested</span>' : `<span class="text-slate-400">&bull;</span><button data-act="g-join" data-id="${gh.id}" class="text-brand-600 font-semibold hover:underline">Join</button>`)}</p>
      <p class="text-xs text-slate-500 flex items-center flex-wrap gap-x-1 mt-0.5"><a href="#/profile/${p.user.id}" class="font-semibold text-slate-600 hover:underline">${nm(p.user)}</a>&bull; ${ago(p.created_at)}${p.edited ? ' &middot; Edited' : ''} &bull; <span title="${pl}">${ic(pi, 'w-3 h-3')}</span></p>` : `<a href="#/profile/${p.user.id}" aria-label="View profile">${av(p.user, 44, true)}</a>
      <div ${hdr} class="min-w-0 flex-1 ${open ? '' : 'cursor-pointer rounded-2xl hover:bg-slate-50 transition -m-1 p-1'}"><p class="leading-snug">${name}${p.shared_post_id ? ' <span class="text-slate-500 font-normal">reposted</span>' : ''}${tags}${grpTag}</p>
      <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5">${ago(p.created_at)}${p.edited ? ' &middot; Edited' : ''} &middot; <span title="${pl}">${ic(pi, 'w-3 h-3')}</span></p>`;
  return `<article class="card reveal" data-post="${p.id}">
    <div class="flex items-start gap-3">${headHtml}</div>
      <button data-act="post-menu" data-id="${p.id}" class="icon-btn -mt-1 -mr-2" aria-label="Post options" aria-haspopup="true">${ic('more', 'w-[22px] h-[22px]')}</button></div>
    ${p.content ? `<p class="mt-3 whitespace-pre-wrap break-words" style="font-size:clamp(.95rem,2.4vw,1.02rem)">${esc(p.content)}</p>` : ''}
    ${imgGrid(p)}
    ${shared}
    <div data-foot="${p.id}">${foot(p)}</div>
    <div data-comments="${p.id}" class="${open ? '' : 'hidden'} pt-3 border-t border-slate-100 mt-2"></div>
  </article>`;
}
const renderFoot = p => $$(`[data-foot="${p.id}"]`).forEach(f => f.innerHTML = foot(p));

function adjust(o, next) {
  o.reactions = o.reactions || {};
  if (o.my_reaction) { o.reactions[o.my_reaction] = Math.max(0, (+o.reactions[o.my_reaction] || 0) - 1); if (!o.reactions[o.my_reaction]) delete o.reactions[o.my_reaction]; }
  if (next) o.reactions[next] = (+o.reactions[next] || 0) + 1;
  o.my_reaction = next;
}
async function reactPost(id, emoji) {
  const p = S.posts.get(id); if (!p) return;
  const next = p.my_reaction === emoji ? null : emoji;
  adjust(p, next); renderFoot(p);
  try { await api(`/posts/${id}/react`, { body: { type: next } }); } catch (e) { toast(e.message); }
}

async function loadFeed(reset, userId, tok, groupId) {
  if (reset) { S.feed.cursor = null; S.feed.group = groupId || null; }
  const r = await api('/feed?' + (userId ? 'user_id=' + userId + '&' : '') + (S.feed.group ? 'group_id=' + S.feed.group + '&' : '') + (S.feed.cursor ? 'before=' + S.feed.cursor : ''));
  if (tok !== S.routeTok) return;
  const box = $('#feed'); if (!box) return;
  if (reset) box.innerHTML = '';
  box.insertAdjacentHTML('beforeend', r.posts.map(p => postCard(p)).join(''));
  if (reset && !r.posts.length) box.innerHTML = empty('No posts yet', userId && userId !== S.me.id ? 'Nothing to show here.' : 'Be the first to share something!', 'globe');
  if (r.posts.length) S.feed.cursor = r.posts[r.posts.length - 1].id;
  const more = $('#more'); if (more) more.innerHTML = r.posts.length >= 20 ? `<button data-act="more" data-user="${userId || ''}" class="btn btn-ghost">Load more</button>` : '';
  reveal();
}
async function viewHome(_, tok) {
  $('#view').innerHTML = `<div class="max-w-2xl mx-auto space-y-4"><h1 class="text-2xl font-extrabold px-1">Home</h1><div id="notes"></div>
    <div class="card flex items-center gap-3">${av(S.me, 44)}<button data-act="compose" class="flex-1 text-left min-h-[44px] px-4 rounded-full bg-slate-100 hover:bg-slate-200/70 text-slate-500 transition truncate">What's on your mind, ${esc(S.me.first_name)}?</button><button data-act="compose-photo" class="icon-btn !text-brand-500" aria-label="Add photo">${ic('image', 'w-6 h-6')}</button></div>
    <div id="feed" class="space-y-4">${skel(2)}</div><div id="more" class="text-center pb-4"></div></div>`;
  drawNotes();
  await loadFeed(true, null, tok);
}
async function drawNotes() {
  const box = $('#notes'); if (!box) return;
  let r; try { r = await api('/notes'); } catch (e) { box.innerHTML = ''; return; }
  if (!$('#notes')) return;
  const mine = r.notes.find(n => n.user.id === S.me.id); S.me.note = mine ? mine.note : null;
  const bubble = t => `<span class="absolute top-0 left-1/2 -translate-x-1/2 w-[84px] bg-white shadow-soft border border-slate-100 rounded-2xl px-2 py-1 text-[11px] leading-tight line-clamp-2 break-words text-center">${esc(t)}</span>`;
  const item = (tag, attrs, u, text, label) => `<${tag} ${attrs} class="relative shrink-0 w-[84px] pt-10 flex flex-col items-center gap-1 text-center">${text ? bubble(text) : `<span class="absolute top-1 left-1/2 -translate-x-1/2 w-[84px] text-[11px] font-semibold text-brand-600 bg-brand-50 rounded-2xl px-2 py-1.5">${ic('plus', 'w-3 h-3 inline -mt-0.5')} Add note</span>`}${av(u, 56, true)}<span class="text-xs font-medium truncate w-full">${label}</span></${tag}>`;
  box.innerHTML = `<div class="card !p-3 flex gap-2 overflow-x-auto">${item('button', 'data-act="note"', S.me, S.me.note, 'Your note')}${r.notes.filter(n => n.user.id !== S.me.id).map(n => item('a', `href="#/profile/${n.user.id}"`, n.user, n.note, esc(n.user.first_name))).join('')}</div>`;
}

function postMenu(el) {
  const p = S.posts.get(+el.dataset.id); if (!p) return;
  const own = p.user.id === S.me.id, it = [
    { act: 'pm-save', id: p.id, icon: 'bookmark', label: p.saved ? 'Unsave post' : 'Save post' },
    { act: 'pm-share', id: p.id, icon: 'share', label: 'Share' }];
  if (own) it.push({ act: 'pm-edit', id: p.id, icon: 'edit', label: 'Edit post' });
  if (own || S.me.is_admin) it.push({ act: 'pm-trash', id: p.id, icon: 'trash', label: 'Move to trash', danger: true });
  if (!own && p.group && S.grp && S.grp.id === p.group.id && ['admin', 'mod'].includes(S.grp.my_role)) it.push({ act: 'pm-gremove', id: p.id, icon: 'trash', label: 'Remove from group', danger: true });
  if (!own) it.push({ act: 'pm-report', id: p.id, icon: 'flag', label: 'Report', danger: true });
  showPop(el, it);
}
function replaceCard(p) {
  S.posts.set(p.id, p);
  $$(`[data-post="${p.id}"]`).forEach(a => {
    const inM = !!a.closest('.modal-card'), t = document.createElement('div');
    t.innerHTML = postCard(p, { open: inM }); const n = t.firstElementChild; n.classList.add('in'); a.replaceWith(n);
    if (inM && S.comments[p.id]) renderComments(p.id);
  });
}
function openEditPost(id) {
  const p = S.posts.get(id); if (!p) return;
  const o = (v, l) => `<option value="${v}" ${p.privacy === v ? 'selected' : ''}>${l}</option>`;
  const m = modal(`<form class="pb-5">${mhead('Edit post')}<div class="px-5 space-y-3"><textarea name="content" rows="5" maxlength="5000" class="input resize-none" aria-label="Post text">${esc(p.content)}</textarea><select name="privacy" class="input" aria-label="Who can see this?">${o('public', 'Public')}${o('friends', 'Friends')}${o('me', 'Only me')}</select><button class="btn btn-primary w-full">Save changes</button></div></form>`);
  const f = $('form', m);
  f.onsubmit = async e => {
    e.preventDefault();
    await busy($('.btn-primary', f), async () => {
      try { const r = await api('/posts/' + id, { method: 'PUT', body: { content: f.content.value, privacy: f.privacy.value } }); m._close(); replaceCard(r.post); toast('Post updated'); }
      catch (ex) { toast(ex.message); }
    });
  };
  setTimeout(() => f.content.focus(), 80);
}

/* composer */
async function openComposer(withPhoto = false, gid = null) {
  const st = { images: [], tags: new Map() };
  const m = modal(`<form class="pb-5">${mhead('Create post')}
    <div class="px-5 space-y-3">
      <div class="flex items-center gap-3">${av(S.me, 44)}<div><p class="font-semibold leading-tight">${esc(S.me.first_name + ' ' + S.me.last_name)}</p>
        <select name="privacy" class="mt-0.5 text-xs font-semibold bg-slate-100 rounded-full px-2.5 min-h-[30px] outline-none focus:ring-2 focus:ring-brand-200" aria-label="Who can see your post?"><option value="public">Public</option><option value="friends">Friends</option><option value="me">Only me</option></select></div></div>
      <textarea name="content" rows="4" maxlength="5000" class="w-full resize-none outline-none text-lg placeholder:text-slate-400 min-h-[110px]" placeholder="What's on your mind, ${esc(S.me.first_name)}?"></textarea>
      <div id="cImg"></div><div id="cTags" class="flex flex-wrap gap-2"></div>
      <div id="tagPanel" class="hidden rounded-2xl border border-slate-200 p-2 max-h-52 overflow-y-auto"></div>
      <div class="flex items-center gap-2 border border-slate-200 rounded-2xl p-1.5"><span class="text-sm font-medium text-slate-500 px-2 flex-1">Add to your post</span>
        <button type="button" data-ci="photo" class="icon-btn !text-emerald-500" aria-label="Add photo">${ic('image', 'w-6 h-6')}</button>
        <button type="button" data-ci="tag" class="icon-btn !text-brand-500" aria-label="Tag friends">${ic('tag', 'w-6 h-6')}</button></div>
      <button class="btn btn-primary w-full">Post</button></div></form>`);
  const f = $('form', m);
  if (gid) f.privacy.classList.add('hidden');
  const drawImg = () => { $('#cImg', m).innerHTML = st.images.length ? `<div class="grid grid-cols-3 gap-2">${st.images.map((u, i) => `<div class="relative aspect-square"><img src="${u}" class="w-full h-full object-cover rounded-2xl" alt=""><button type="button" data-ci="rm" data-i="${i}" class="icon-btn !bg-white/90 absolute top-1 right-1 !w-8 !h-8 shadow-soft" aria-label="Remove photo">${ic('x', 'w-4 h-4')}</button></div>`).join('')}${st.images.length < 10 ? `<button type="button" data-ci="photo" class="aspect-square rounded-2xl border-2 border-dashed border-slate-200 text-slate-400 hover:bg-slate-50 flex flex-col items-center justify-center text-xs gap-1">${ic('plus', 'w-6 h-6')}Add more</button>` : ''}</div><p class="text-xs text-slate-400 mt-1.5">${st.images.length}/10 photos</p>` : ''; };
  const drawTags = () => { $('#cTags', m).innerHTML = [...st.tags.values()].map(u => `<span class="chip">${esc(u.name)}<button type="button" data-untag="${u.id}" class="ml-1" aria-label="Remove tag">&times;</button></span>`).join(''); };
  f.addEventListener('click', async e => {
    const b = e.target.closest('[data-ci],[data-untag]'); if (!b) return;
    if (b.dataset.untag) { st.tags.delete(+b.dataset.untag); drawTags(); return; }
    const k = b.dataset.ci;
    if (k === 'photo') { if (st.images.length >= 10) { toast('You can add up to 10 photos.'); return; } const add = await pickMany(PH, 10 - st.images.length); st.images.push(...add); drawImg(); }
    if (k === 'rm') { st.images.splice(+b.dataset.i, 1); drawImg(); }
    if (k === 'tag') {
      const tp = $('#tagPanel', m); tp.classList.toggle('hidden');
      if (!tp.dataset.loaded) {
        tp.innerHTML = '<p class="text-sm text-slate-400 p-2">Loading friends…</p>';
        try {
          const r = await api('/friends'); tp.dataset.loaded = 1;
          tp.innerHTML = r.friends.length ? r.friends.map(u => `<label class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 cursor-pointer min-h-[44px]"><input type="checkbox" value="${u.id}" class="w-5 h-5 accent-[#6d5efc]">${av(u, 32)}<span class="text-sm font-medium">${esc(u.name)}</span></label>`).join('') : '<p class="text-sm text-slate-400 p-2">Add friends to tag them.</p>';
          tp.onchange = ev => { const id = +ev.target.value, u = r.friends.find(x => x.id === id); ev.target.checked ? st.tags.set(id, u) : st.tags.delete(id); drawTags(); };
        } catch (ex) { tp.innerHTML = `<p class="text-sm text-rose-500 p-2">${esc(ex.message)}</p>`; }
      }
    }
  });
  f.onsubmit = async e => {
    e.preventDefault();
    const content = f.content.value.trim();
    if (!content && !st.images.length) { toast('Write something or add a photo.'); return; }
    await busy($('.btn-primary', f), async () => {
      try {
        const r = await api('/posts', { body: { content, images: st.images, privacy: f.privacy.value, tags: [...st.tags.keys()], group_id: gid } });
        m._close(); toast('Posted!');
        const feed = $('#feed');
        if (feed && (location.hash === '#/home' || location.hash === '' || location.hash.startsWith('#/profile') || location.hash.startsWith('#/groups/'))) {
          if (feed.querySelector('.text-center.py-10')) feed.innerHTML = '';
          feed.insertAdjacentHTML('afterbegin', postCard(r.post)); reveal();
        }
      } catch (ex) { toast(ex.message); }
    });
  };
  setTimeout(() => f.content.focus(), 80);
  if (withPhoto) { st.images = await pickMany(PH, 10); drawImg(); }
}
async function openRepost(id) {
  const p = S.posts.get(id); if (!p) return;
  const root = p.shared_post_id && p.shared ? p.shared : p;
  const m = modal(`<form class="pb-5">${mhead('Repost')}<div class="px-5 space-y-3">
    <textarea name="content" rows="3" maxlength="5000" class="input resize-none" placeholder="Say something about this… (optional)"></textarea>
    <select name="privacy" class="input" aria-label="Who can see this?"><option value="public">Public</option><option value="friends">Friends</option><option value="me">Only me</option></select>
    ${miniPost(root)}<button class="btn btn-primary w-full">Repost now</button></div></form>`);
  const f = $('form', m);
  f.onsubmit = async e => {
    e.preventDefault();
    await busy($('.btn-primary', f), async () => {
      try {
        const r = await api(`/posts/${root.id}/repost`, { body: { content: f.content.value, privacy: f.privacy.value } });
        m._close(); toast('Reposted!');
        const feed = $('#feed'); if (feed) { feed.insertAdjacentHTML('afterbegin', postCard(r.post)); reveal(); }
        const orig = S.posts.get(root.id); if (orig) { orig.share_count++; renderFoot(orig); }
      } catch (ex) { toast(ex.message); }
    });
  };
}
async function openPostModal(id) {
  try {
    const r = await api('/posts/' + id);
    const m = modal(`${mhead('Comments')}<div class="px-3 pb-4">${postCard(r.post, { open: true })}</div>`, { wide: true });
    $$('.reveal', m).forEach(e => e.classList.add('in'));
    loadComments(id);
  } catch (e) { toast(e.message); }
}

async function viewPostPage(arg, tok) {
  await viewHome(null, tok);
  if (tok === S.routeTok && arg) openPostModal(+arg);
}
async function viewSaved(_, tok) {
  const t = S.stab || 'saved';
  $('#view').innerHTML = `<div class="max-w-2xl mx-auto space-y-4"><h1 class="text-2xl font-extrabold px-1">Saved</h1><div class="flex gap-1 bg-slate-100 rounded-full p-1">${[['saved', 'Saved posts'], ['trash', 'Trash']].map(x => `<button data-act="stab" data-t="${x[0]}" class="tab flex-1 ${t === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div><div id="slist" class="space-y-4">${skel(2)}</div></div>`;
  if (t === 'saved') {
    const r = await api('/saved'); if (tok !== S.routeTok) return;
    $('#slist').innerHTML = r.posts.length ? r.posts.map(p => postCard(p)).join('') : empty('Nothing saved yet', 'Use the three-dot menu on a post to save it.', 'bookmark');
  } else {
    const r = await api('/trash'); if (tok !== S.routeTok) return;
    $('#slist').innerHTML = r.posts.length ? r.posts.map(p => `<div class="card !p-4 space-y-3"><p class="text-xs text-slate-400">Moved to trash &middot; ${ago(p.trashed_at)}</p><p class="text-sm break-words whitespace-pre-wrap">${p.content ? esc(p.content) : '<i class="text-slate-400">(photo post)</i>'}</p>${p.has_image ? `<span class="chip">${ic('image', 'w-3.5 h-3.5')} Photo</span>` : ''}<div class="flex gap-2"><button data-act="trash-restore" data-id="${p.id}" class="btn btn-soft !px-4">${ic('undo', 'w-4 h-4')} Restore</button><button data-act="trash-del" data-id="${p.id}" class="btn btn-danger !px-4">${ic('trash', 'w-4 h-4')} Delete forever</button></div></div>`).join('') : empty('Trash is empty', 'Posts you move to trash show up here.', 'trash');
  }
  reveal();
}

/* comments */
const commentTree = list => { const by = {}, roots = []; list.forEach(c => { c.kids = []; by[c.id] = c; }); list.forEach(c => (c.parent_id && by[c.parent_id]) ? by[c.parent_id].kids.push(c) : roots.push(c)); return roots; };
const cNames = pid => { const p = S.posts.get(pid), set = new Set([S.me.name]); (S.comments[pid] || []).forEach(c => set.add(c.user.name)); if (p) set.add(p.user.name); return [...set].filter(Boolean); };
function mentionize(text, names, cls = 'text-brand-600 font-semibold bg-brand-50 rounded px-1') {
  const html = esc(text), list = [...new Set(names.filter(Boolean))].sort((a, b) => b.length - a.length);
  if (!list.length) return html;
  const re = new RegExp('@(' + list.map(n => esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w])', 'g');
  return html.replace(re, `<span class="${cls}">@$1</span>`);
}
function commentHTML(c, depth, pid, names) {

  'm-hide': async el => { if (!(await confirmBox('Delete message?', 'This removes the message from your chat only. Other people can still see it.', 'Delete'))) return; try { await api(`/messages/${el.dataset.id}/hide`, { body: {} }); await pollMsgs(); } catch (e) { toast(e.message); } },
  'opera-ask': async el => { try { await api(`/chats/${S.chat.id}/messages`, { body: { content: '@Opera ' + el.dataset.q } }); await pollMsgs(); const b = $('#msgs'); if (b) b.scrollTop = b.scrollHeight; } catch (e) { toast(e.message); } },
  'c-cancel-reply': el => { const box = el.closest('[data-comments]'), f = $('[data-form="c-add"]', box), bar = $('[data-creply]', box); f.dataset.parent = ''; $('input', f).value = ''; bar.classList.add('hidden'); bar.innerHTML = ''; },
  'c-del': async el => { if (!(await confirmBox('Delete comment?', 'Replies to it will be removed too.', 'Delete'))) return; const pid = +el.dataset.pid; try { await api('/comments/' + el.dataset.id, { method: 'DELETE' }); S.comments[pid] = (await api(`/posts/${pid}/comments`)).comments; const p = S.posts.get(pid); if (p) { p.comment_count = S.comments[pid].length; renderFoot(p); } renderComments(pid); } catch (e) { toast(e.message); } },
  /* friends */
  ftab: el => { S.ftab = el.dataset.t; S.fq = ''; viewFriends(null, S.routeTok, ''); },
  add: async el => { try { const r = await api('/friends/request', { body: { user_id: +el.dataset.id } }); toast(r.status === 'friends' ? 'You are now friends!' : 'Friend request sent'); if (el.dataset.pf) route(true); else { el.outerHTML = '<span class="btn btn-ghost !px-4 opacity-70">Requested</span>'; pollCounts(); } } catch (e) { toast(e.message); } },
  accept: async el => { try { await api('/friends/accept', { body: { user_id: +el.dataset.id } }); toast('Friend request accepted'); el.dataset.pf ? route(true) : viewFriends(null, S.routeTok, S.fq || ''); pollCounts(); } catch (e) { toast(e.message); } },
  unfriend: async el => {
    const friends = !!el.dataset.fr || el.getAttribute('aria-label') === 'Unfriend';
    if (friends && !(await confirmBox('Unfriend?', 'You can add them again later.', 'Unfriend'))) return;
    try { await api('/friends/remove', { body: { user_id: +el.dataset.id } }); el.dataset.pf ? route(true) : viewFriends(null, S.routeTok, S.fq || ''); pollCounts(); } catch (e) { toast(e.message); }
  },
  dm: el => openDm(+el.dataset.id),
  'notif-menu': el => showPop(el, el.dataset.ann ? [{ act: 'an-del', id: el.dataset.id, icon: 'trash', label: 'Delete this notification' }] : [{ act: 'nt-del', id: el.dataset.id, icon: 'trash', label: 'Delete this notification' }, { act: 'nt-report', id: el.dataset.id, icon: 'flag', label: 'Report this notification', danger: true }]),
  'nt-del': async el => { try { await api('/notifications/' + el.dataset.id, { method: 'DELETE' }); $(`[data-nid="${el.dataset.id}"]`)?.remove(); toast('Notification deleted'); route(true); } catch (e) { toast(e.message); } },
  'nt-report': async el => { const r = await askText('Report notification', '', { ph: 'What is wrong? (optional)', ok: 'Report' }); if (r === null) return; try { await api(`/notifications/${el.dataset.id}/report`, { body: { reason: r } }); toast('Thanks - we will review this.'); } catch (e) { toast(e.message); } },
  'an-del': el => { const h = JSON.parse(localStorage.getItem('wz_ann_hidden') || '[]'); h.push(+el.dataset.id); localStorage.setItem('wz_ann_hidden', JSON.stringify(h)); toast('Notification deleted'); route(true); },
  notif: el => { if (el.dataset.pid) openPostModal(+el.dataset.pid); else if (el.dataset.type === 'group_approve') location.hash = '#/groups';
  else if (el.dataset.type.startsWith('friend')) location.hash = '#/friends'; else location.hash = '#/profile/' + el.dataset.uid; },
  /* profile */
  'edit-profile': () => editProfile(),
  'copy-id': el => { navigator.clipboard?.writeText(el.dataset.uid).then(() => toast('ID copied')).catch(() => toast('ID: ' + el.dataset.uid)); },
  /* messages */
  'new-group': () => openNewGroup(),
  'chat-settings': () => openSettings(),
  attach: async () => { S.img = await pick(PH); drawImgPrev(); },
  'rm-attach': () => { S.img = null; drawImgPrev(); },
  'cancel-reply': () => { S.reply = null; drawReply(); },
  older: async () => { S.limit += 100; await pollMsgs(true); },
  'm-tap': el => { const msg = el.closest('.msg'), was = msg.classList.contains('show'); $$('.msg.show').forEach(x => x.classList.remove('show')); if (!was) msg.classList.add('show'); },
  'm-react': el => { const id = +el.dataset.id; showPicker(el, e => reactMsg(id, e)); },
  'm-reply': el => {
    const m = S.msgs.find(x => x.id === +el.dataset.id); if (!m) return;
    S.reply = { id: m.id, name: m.sender_id === S.me.id ? 'yourself' : nameOf(m.sender_id, m.sender.name), text: m.content || (m.image ? 'Photo' : '') };
    $$('.msg.show').forEach(x => x.classList.remove('show')); drawReply(); $('#minput')?.focus();
  },
  'm-unsend': async el => { if (!(await confirmBox('Unsend message?', 'This removes it for everyone in the chat.', 'Unsend'))) return; try { await api(`/messages/${el.dataset.id}/unsend`, { method: 'POST', body: {} }); await pollMsgs(); } catch (e) { toast(e.message); } },
  'm-report': async el => { const r = await askText('Report message', '', { ph: 'What is wrong with this message? (optional)', ok: 'Report' }); if (r === null) return; try { await api(`/messages/${el.dataset.id}/report`, { body: { reason: r } }); toast('Thanks - we will review this message.'); } catch (e) { toast(e.message); } },
  jump: el => { const t = $(`[data-mid="${el.dataset.id}"]`); if (t) { t.scrollIntoView({ block: 'center', behavior: RM ? 'auto' : 'smooth' }); t.classList.remove('pop-in'); void t.offsetWidth; t.classList.add('pop-in'); } },
  block: async el => { if (!(await confirmBox('Block this user?', "They won't be able to message you and you won't see each other's posts.", 'Block'))) return; try { await api('/blocks', { body: { user_id: +el.dataset.id } }); toast('User blocked'); await afterSettings(); } catch (e) { toast(e.message); } },
  unblock: async () => { const o = S.chat.members.find(x => x.user.id !== S.me.id); try { await api('/blocks/' + o.user.id, { method: 'DELETE' }); toast('User unblocked'); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-nick': async el => { const id = +el.dataset.id, m = S.chat.members.find(x => x.user.id === id), v = await askText('Set nickname', m.nickname || '', { ph: m.user.name }); if (v === null) return; try { await api(`/chats/${S.chat.id}/nickname`, { method: 'PUT', body: { user_id: id, nickname: v } }); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-pic': async () => { const p = await pick(AV); try { await api('/chats/' + S.chat.id, { method: 'PUT', body: { picture: p } }); toast('Group photo updated'); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-add': () => openAddPeople(),
  'g-role': async el => { try { await api(`/chats/${S.chat.id}/coadmin`, { body: { user_id: +el.dataset.id, make: !!el.dataset.make } }); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-remove': async el => { const m = S.chat.members.find(x => x.user.id === +el.dataset.id); if (!(await confirmBox('Remove member?', `Remove ${m.user.name} from this group?`, 'Remove'))) return; try { await api(`/chats/${S.chat.id}/members/${el.dataset.id}`, { method: 'DELETE' }); await afterSettings(); } catch (e) { toast(e.message); } },
  'g-leave': async () => { if (!(await confirmBox('Leave group?', "You won't receive messages from this group anymore.", 'Leave'))) return; try { await api(`/chats/${S.chat.id}/leave`, { method: 'POST', body: {} }); S.setEl?._close(); toast('You left the group'); location.hash = '#/messages'; } catch (e) { toast(e.message); } },
  follow: async el => { try { await api(`/users/${el.dataset.id}/follow`, { body: {} }); route(true); } catch (e) { toast(e.message); } },
  'a-warn': async el => {
    const msg = await askText(`Warn ${el.dataset.name}`, 'Your content was reported and violates our community guidelines. Further violations may lead to your account being banned.', { ph: 'Warning message', ok: 'Send warning' });
    if (!msg) return;
    try { await api(`/admin/users/${el.dataset.id}/warn`, { body: { message: msg } }); toast('Warning sent'); } catch (e) { toast(e.message); }
  },
  'gset-view': el => { S.setView = el.dataset.v || 'main'; refreshSettings(); },
  'gs-rename': async () => { const v = await askText('Change group name', S.chat.name || S.chat.title || '', { ph: 'Group name' }); if (!v) return; try { await api('/chats/' + S.chat.id, { method: 'PUT', body: { name: v } }); toast('Group renamed'); await afterSettings(); loadChats(); } catch (e) { toast(e.message); } },
  'gs-mute': async () => { try { const r = await api(`/chats/${S.chat.id}/mute`, { method: 'PUT', body: { muted: !S.chat.muted } }); S.chat.muted = r.muted; toast(r.muted ? 'Notifications muted' : 'Notifications on'); await afterSettings(); pollCounts(); } catch (e) { toast(e.message); } },
  'gs-unread': async () => { try { await api(`/chats/${S.chat.id}/unread`, { body: {} }); S.setEl?._close(); location.hash = '#/messages'; pollCounts(); toast('Marked as unread'); } catch (e) { toast(e.message); } },
  'gs-report': async () => { const r = await askText('Report conversation', '', { ph: 'What is wrong? (optional)', ok: 'Report' }); if (r === null) return; try { await api(`/chats/${S.chat.id}/report`, { body: { reason: r } }); toast('Thanks - we will review this conversation.'); } catch (e) { toast(e.message); } },
  'gs-qr': () => {
    const id = S.chat.id, m = modal(`${mhead('Quick reaction')}<div class="px-5 pb-6"><p class="text-sm text-slate-500 mb-3">Sent when you tap the button next to an empty message box.</p><div class="grid grid-cols-6 gap-2">${QR_LIST.map(e => `<button data-e="${e}" class="aspect-square rounded-2xl text-2xl flex items-center justify-center hover:bg-slate-100 ${qrGet(id) === e ? '!bg-brand-50 ring-2 ring-brand-400' : ''}">${e}</button>`).join('')}</div></div>`);
    m.addEventListener('click', e => { const b = e.target.closest('[data-e]'); if (!b) return; localStorage.setItem('wz_qr_' + id, b.dataset.e); m._close(); refreshSettings(); syncSend(); });
  },
  /* groups */
  gtab: el => { S.gtab = el.dataset.t; route(true); },
  gsub: el => { S.gsub = el.dataset.t; route(true); },
  'g-create': () => openGroupForm(null),
  'g-edit': () => S.grp && openGroupForm(S.grp),
  'g-invite': el => openGroupInvite(+el.dataset.id),
  'g-compose': el => openComposer(false, +el.dataset.id),
  'g-compose-photo': el => openComposer(true, +el.dataset.id),
  'g-join': async el => { try { const r = await api(`/groups/${el.dataset.id}/join`, { body: {} }); toast(r.status === 'member' ? 'You joined the group' : 'Request sent'); route(true); } catch (e) { toast(e.message); } },
  'grp-leave': async el => {
    const cancel = !!el.dataset.cancel;
    if (!cancel && !(await confirmBox('Leave group?', 'You will stop seeing its posts.', 'Leave'))) return;
    try { await api(`/groups/${el.dataset.id}/leave`, { body: {} }); toast(cancel ? 'Request cancelled' : 'You left the group'); if (cancel) route(true); else location.hash = '#/groups'; } catch (e) { toast(e.message); }
  },
  'gm-approve': async el => { try { await api(`/groups/${el.dataset.gid}/members/${el.dataset.id}/approve`, { body: {} }); toast('Request approved'); route(true); } catch (e) { toast(e.message); } },
  'gm-remove': async el => {
    if (el.dataset.name && !(await confirmBox('Remove member?', `Remove ${el.dataset.name} from this group?`, 'Remove'))) return;
    try { await api(`/groups/${el.dataset.gid}/members/${el.dataset.id}`, { method: 'DELETE' }); route(true); } catch (e) { toast(e.message); }
  },
  'gm-role': async el => { try { await api(`/groups/${el.dataset.gid}/members/${el.dataset.id}/role`, { body: { make: !!el.dataset.make } }); route(true); } catch (e) { toast(e.message); } },
  'pm-gremove': async el => {
    if (!S.grp || !(await confirmBox('Remove this post?', 'It will be removed from the group for everyone.', 'Remove'))) return;
    try { await api(`/groups/${S.grp.id}/posts/${el.dataset.id}`, { method: 'DELETE' }); $$(`[data-post="${el.dataset.id}"]`).forEach(a => a.remove()); toast('Post removed'); } catch (e) { toast(e.message); }
  },
  /* admin */
  atab: el => { S.atab = el.dataset.t; route(true); },
  'a-ban': async el => { const ban = !!el.dataset.banned; if (ban && !(await confirmBox('Ban this user?', 'They will be logged out and unable to sign in.', 'Ban'))) return; try { await api('/admin/ban', { body: { user_id: +el.dataset.id, banned: ban } }); toast(ban ? 'User banned' : 'User unbanned'); route(true); } catch (e) { toast(e.message); } },
  'a-del': async el => { if (!(await confirmBox('Delete account?', `Permanently delete ${el.dataset.name} and all their data?`, 'Delete'))) return; try { await api('/admin/users/' + el.dataset.id, { method: 'DELETE' }); toast('Account deleted'); route(true); } catch (e) { toast(e.message); } },
  'a-chat-del': async el => { if (!(await confirmBox('Delete group chat?', `"${el.dataset.name}" and all its messages will be removed for everyone.`, 'Delete'))) return; try { await api('/admin/chats/' + el.dataset.id, { method: 'DELETE' }); toast('Group chat deleted'); route(true); } catch (e) { toast(e.message); } },
  'a-ann-clear': async () => { try { await api('/admin/announcement', { body: { text: '' } }); toast('Announcement removed'); pollCounts(); route(true); } catch (e) { toast(e.message); } },
  'a-rep-del': async el => { try { await api('/admin/reports/' + el.dataset.id, { method: 'DELETE' }); route(true); } catch (e) { toast(e.message); } }
};
document.addEventListener('click', e => {
  if (Date.now() - (window._lpAt || 0) < 700) { e.preventDefault(); e.stopPropagation(); return; }
  if (!e.target.closest('#plusmenu,[data-act=plus]')) $('#plusmenu')?.classList.add('hidden');
  if (popEl && !e.target.closest('.popmenu,[data-act=post-menu]')) hidePop();
  if (pickerEl && !e.target.closest('.picker') && Date.now() - (window._lpAt || 0) > 700) hidePicker();
  if (!e.target.closest('.msg')) $$('.msg.show').forEach(x => x.classList.remove('show'));
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el._long) { el._long = false; e.preventDefault(); return; }
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
  if (el.closest('#plusmenu')) $('#plusmenu')?.classList.add('hidden');
  if (el.closest('.popmenu')) hidePop();
});

/* reaction picker: hover (mouse) and long-press (touch) */
function openPick(b) {
  const id = +b.dataset.id, kind = b.dataset.kind;
  if (kind === 'post') showPicker(b, em => reactPost(id, em));
  else if (kind === 'comment') showPicker(b, em => reactComment(id, +b.dataset.pid, em));
}
let hoverT, pressT;
document.addEventListener('mouseover', e => { const b = e.target.closest('[data-pick]'); if (!b || b.contains(e.relatedTarget)) return; clearTimeout(hoverT); hoverT = setTimeout(() => openPick(b), 420); });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-pick]')) clearTimeout(hoverT); });
document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-pick]'); if (!b || e.pointerType === 'mouse') return; pressT = setTimeout(() => { b._long = true; openPick(b); }, 450); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(pressT); clearTimeout(msgPressT); }));
let msgPressT, lpX = 0, lpY = 0;
function openLP(b) {
  window._lpAt = Date.now(); hidePicker(); hidePop();
  if (b.dataset.lp === 'msg') msgSheet(+b.dataset.id);
  else if (b.dataset.lp === 'comment') commentSheet(+b.dataset.pid, +b.dataset.id);
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const b = e.target.closest('[data-lp]'); if (!b || e.target.closest('[data-act=c-reactors],[data-act=m-reactors]')) return;
  if (b.dataset.lp === 'msg' && b.textContent.includes('Message was unsent')) return;
  lpX = e.clientX; lpY = e.clientY; clearTimeout(msgPressT);
  msgPressT = setTimeout(() => openLP(b), 420);
});
document.addEventListener('pointermove', e => { if (msgPressT && (Math.abs(e.clientX - lpX) > 10 || Math.abs(e.clientY - lpY) > 10)) clearTimeout(msgPressT); });
document.addEventListener('contextmenu', e => { const b = e.target.closest('[data-lp]'); if (!b) return; e.preventDefault(); if (Date.now() - (window._lpAt || 0) > 900) openLP(b); });
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-pick]')) e.preventDefault(); });
addEventListener('scroll', () => { hidePicker(); hidePop(); }, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hidePicker(); hidePop(); const m = $$('.modal-wrap').pop(); m && m._close && m._close(); } });

boot();
})();
</script>
</body>
