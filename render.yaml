services:
  - type: web
    name: wazzup-messenger
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LEADER_EMAIL
        sync: false
      - key: LEADER_PASSWORD
        sync: false
